# runtime-operator 2.8.0 templates/nats/deployment.yaml, rendered by `helm template wasmcloud` (#550).
# Source: runtime-operator/templates/nats/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: wasmcloud
  labels:
    wasmcloud.com/name: nats
    helm.sh/chart: runtime-operator-2.8.0
    app.kubernetes.io/name: runtime-operator
    app.kubernetes.io/instance: wasmcloud
    app.kubernetes.io/version: '2.8.0'
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      wasmcloud.com/name: nats
  template:
    metadata:
      labels:
        wasmcloud.com/name: nats
        helm.sh/chart: runtime-operator-2.8.0
        app.kubernetes.io/name: runtime-operator
        app.kubernetes.io/instance: wasmcloud
        app.kubernetes.io/version: '2.8.0'
        app.kubernetes.io/managed-by: Helm
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: nats-config
          configMap:
            name: nats
        # Writable scratch dir so the container can run with a read-only root fs.
        - name: tmp
          emptyDir: {}
        # JetStream store dir (see nats/config.yaml store_dir).
        - name: jetstream
          emptyDir: {}
        - name: nats-cert
          secret:
            secretName: wasmcloud-nats-tls
      serviceAccountName: wasmcloud-runtime-operator-nats

      containers:
        - name: nats
          image: docker.io/nats:2.12.8-alpine
          args:
            - '-DV'
            - '-c'
            - '/nats-config/nats-server.conf'
          imagePullPolicy: Always
          volumeMounts:
            - name: nats-config
              mountPath: /nats-config
            - name: tmp
              mountPath: /tmp
            - name: jetstream
              mountPath: /data/jetstream
            - name: nats-cert
              mountPath: /nats-cert
          ports:
            - name: tcp-nats
              containerPort: 4222
          livenessProbe:
            tcpSocket:
              port: tcp-nats
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: tcp-nats
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 0
