# Source: runtime-operator/templates/runtime/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostgroup-default
  namespace: wasmcloud
  labels:
    wasmcloud.com/name: hostgroup
    wasmcloud.com/hostgroup: default
    helm.sh/chart: runtime-operator-2.8.0
    app.kubernetes.io/name: runtime-operator
    app.kubernetes.io/instance: wasmcloud
    app.kubernetes.io/version: '2.8.0'
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      wasmcloud.com/name: hostgroup
      wasmcloud.com/hostgroup: default
  template:
    metadata:
      labels:
        wasmcloud.com/name: hostgroup
        wasmcloud.com/hostgroup: default
        helm.sh/chart: runtime-operator-2.8.0
        app.kubernetes.io/name: runtime-operator
        app.kubernetes.io/instance: wasmcloud
        app.kubernetes.io/version: '2.8.0'
        app.kubernetes.io/managed-by: Helm
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: oci-cache
          emptyDir: {}
        # wash creates its data/config/cache directories under $HOME (set to /tmp
        # below), so the host needs a writable /tmp to run with a read-only root
        # filesystem.
        - name: tmp
          emptyDir: {}
        - name: runtime-cert
          secret:
            secretName: di-scheduler-platform-host-tls
        - name: data-cert
          secret:
            secretName: di-scheduler-data-tls
      serviceAccountName: wasmcloud-runtime-operator-runtime

      containers:
        - name: host
          image: ghcr.io/wasmcloud/wash:2.8.0
          env:
            # wash resolves its XDG data/config/cache dirs under $HOME; point it
            # at the writable /tmp emptyDir so the host runs with a read-only root
            # filesystem. A user-supplied runtime.env HOME (below) overrides this.
            - name: HOME
              value: /tmp
            - name: WASMCLOUD_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: WASMCLOUD_HOST_ENVIRONMENT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WASH_HOST_MAX_GUEST_MEMORY
              value: '2Gi'
            - name: WASH_DEFAULT_HEAP_MEMORY
              value: '512MiB'
            - name: WASH_CORE_INSTANCES
              value: '100'
          args:
            - 'host'
            - '--host-name=$(WASMCLOUD_HOST_IP)'
            - '--host-group=default'
            - '--environment=$(WASMCLOUD_HOST_ENVIRONMENT)'
            - '--scheduler-nats-url=nats://nats.wasmcloud.svc.cluster.local:4222'
            - '--scheduler-nats-tls-ca=/runtime-cert/ca.crt'
            - '--scheduler-nats-tls-cert=/runtime-cert/tls.crt'
            - '--scheduler-nats-tls-key=/runtime-cert/tls.key'
            - '--data-nats-url=nats://nats.wasmcloud.svc.cluster.local:4222'
            - '--data-nats-tls-ca=/data-cert/ca.crt'
            - '--data-nats-tls-cert=/data-cert/tls.crt'
            - '--data-nats-tls-key=/data-cert/tls.key'
            - '--oci-cache-dir=/oci-cache'
            - '--http-addr=0.0.0.0:9191'
          imagePullPolicy: Always
          volumeMounts:
            - name: oci-cache
              mountPath: /oci-cache
            - name: tmp
              mountPath: /tmp
            - name: runtime-cert
              mountPath: /runtime-cert
              readOnly: true
            - name: data-cert
              mountPath: /data-cert
              readOnly: true
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 256Mi
          ports:
            - name: http
              containerPort: 9191
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 0

