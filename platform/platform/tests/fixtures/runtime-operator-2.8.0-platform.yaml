# Source: runtime-operator/templates/operator/endpointslice-role.yaml
# The EndpointSlice controller only needs access within the watched namespaces.
# These permissions are granted with a namespaced Role + RoleBinding per watched
# namespace (rather than a ClusterRole) so that installing in watchNamespaces mode
# requires no cluster-scoped RBAC. When watchNamespaces is empty (watch all
# namespaces), the main ClusterRole covers endpointslices instead.

---
# Source: runtime-operator/templates/operator/workload-crd-role.yaml
# When operator.watchNamespaces is set, the operator's workload-side CRD access
# (artifacts / workloads / workloadreplicasets / workloaddeployments, plus their
# /status and /finalizers subresources) is scoped to each watched namespace via a
# Role + RoleBinding rather than the cluster-wide ClusterRole in clusterrole.yaml.
# The informer cache is likewise scoped to these namespaces via
# cacheOpts.DefaultNamespaces (see runtime-operator/cmd/main.go), so namespaced
# RBAC is sufficient for the controllers' list/watch.
#
# Host CRDs are intentionally excluded — Host objects always live in the
# operator's own namespace and are granted via the namespaced Role in role.yaml.

---
# Source: runtime-operator/templates/operator/workload-namespace-role.yaml
# When operator.watchNamespaces is set, the operator only ever reads
# configmaps/secrets/services and records events in those namespaces — every
# Get on these resources is keyed by the workload's own namespace, and the
# informer cache is scoped via cacheOpts.DefaultNamespaces. These permissions
# are granted with a namespaced Role + RoleBinding per watched namespace (rather
# than a ClusterRole) so that installing in watchNamespaces mode requires no
# cluster-scoped RBAC. When watchNamespaces is empty (watch all namespaces),
# these rules live on the main ClusterRole instead.
