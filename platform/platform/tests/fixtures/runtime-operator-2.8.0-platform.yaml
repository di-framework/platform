  template:
    metadata:
      labels:
        wasmcloud.com/name: runtime-operator
        helm.sh/chart: runtime-operator-2.8.0
        app.kubernetes.io/name: runtime-operator
        app.kubernetes.io/instance: wasmcloud
        app.kubernetes.io/version: '2.8.0'
        app.kubernetes.io/managed-by: Helm
    spec:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: operator-cert
          secret:
            secretName: di-scheduler-operator-tls
      serviceAccountName: wasmcloud-runtime-operator

      containers:
        - name: runtime-operator
          image: ghcr.io/wasmcloud/runtime-operator:2.8.0
          args:
            - '-nats-url=nats://nats.wasmcloud.svc.cluster.local:4222'
            - '-nats-ca=/operator-cert/ca.crt'
