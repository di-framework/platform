{openapi: 3.1.0,info: {title: Tenant Controller API,version: v1,description: The only surface a tenant CLI talks to. Every call carries an identity-server credential; the controller holds the kubeconfig and never exposes Kubernetes.},paths: {/v1/auth/info: {get: {summary: Describe how to log in,description: The account this controller serves and the identity server to obtain a credential from. The only unauthenticated operation.,operationId: authInfo,responses: {"200": {description: Describe how to log in,content: {application/json: {schema: {type: object,description: "What a CLI needs before it holds a credential: the account this controller serves and the identity server to log in with.",properties: {account: {type: string},issuer: {type: string,format: uri},clientId: {type: string}},required: [account,issuer,clientId]}}}}}}},/v1/auth/logout: {post: {summary: Revoke the credential,description: Revokes the bearer token at the identity server (or the API key) so it stops working everywhere.,operationId: logout,requestBody: {content: {application/json: {schema: {type: object}}},required: false},responses: {"204": {description: Revoke the credential}},security: [{identity: []}]}},/v1/auth/whoami: {get: {summary: Resolve the caller,description: "The user, role, and credential the bearer token stands for in this account.",operationId: whoami,responses: {"200": {description: Resolve the caller,content: {application/json: {schema: {type: object,properties: {user: {type: string},account: {type: string},role: {type: string,enum: [developer,viewer]},via: {type: string,enum: [identity,api-key]},credentialId: {type: string}},required: [user,account,role,via]}}}}},security: [{identity: []}]}},/v1/deploy: {post: {summary: Apply a deployment,description: Validates the bundle and starts the rollout. Progress is streamed by the logs operation of the service.,operationId: deploy,requestBody: {content: {application/json: {schema: {type: object,description: Everything the CLI renders client-side. The controller validates it at the boundary and never receives a kubeconfig or a namespace.,properties: {env: {type: string,enum: [prod,staging]},service: {type: string,description: Service the deployment belongs to.},component: {$ref: "#/components/schemas/ComponentReference"},workload: {type: object,description: "The rendered WorkloadDeployment template, without namespace or host selector.",additionalProperties: true},bindings: {type: array,items: {$ref: "#/components/schemas/Binding"}},secrets: {type: array,description: Names of tenant secrets the workload references; values never travel.,items: {type: string}}},required: [env,service,component,workload,bindings,secrets]}}},required: true},responses: {"202": {description: Apply a deployment,content: {application/json: {schema: {type: object,properties: {id: {type: string},service: {type: string},env: {type: string,enum: [prod,staging]},status: {type: string,enum: [pending,rolling,ready,failed,rolled-back]},component: {$ref: "#/components/schemas/ComponentReference"},createdAt: {type: string,format: date-time},readyAt: {type: string,format: date-time}},required: [id,service,env,status,component,createdAt]}}}}},security: [{identity: []}]}},/v1/deploy/preview: {post: {summary: Preview a deployment,description: "Validates the bundle and reports what applying it would change in the given environment, without changing anything.",operationId: previewDeploy,requestBody: {content: {application/json: {schema: {type: object,description: Everything the CLI renders client-side. The controller validates it at the boundary and never receives a kubeconfig or a namespace.,properties: {env: {type: string,enum: [prod,staging]},service: {type: string,description: Service the deployment belongs to.},component: {$ref: "#/components/schemas/ComponentReference"},workload: {type: object,description: "The rendered WorkloadDeployment template, without namespace or host selector.",additionalProperties: true},bindings: {type: array,items: {$ref: "#/components/schemas/Binding"}},secrets: {type: array,description: Names of tenant secrets the workload references; values never travel.,items: {type: string}}},required: [env,service,component,workload,bindings,secrets]}}},required: true},responses: {"200": {description: Preview a deployment,content: {application/json: {schema: {type: object,description: What applying the bundle would change.,properties: {env: {type: string,enum: [prod,staging]},service: {type: string},changes: {type: array,items: {$ref: "#/components/schemas/DeployChange"}}},required: [env,service,changes]}}}}},security: [{identity: []}]}},/v1/deploy/push-credential: {post: {summary: Get a registry push credential,description: Returns a short-lived registry token scoped to the tenant repository path. The controller mints it as the registry token service; pushes go straight to the registry.,operationId: pushCredential,requestBody: {content: {application/json: {schema: {type: object}}},required: false},responses: {"200": {description: Get a registry push credential,content: {application/json: {schema: {type: object,description: "A short-lived bearer token for the registry token-auth flow, scoped to the tenant repository path. It is never a shared registry secret.",properties: {registry: {type: string,description: Registry host the token is valid for.},repository: {type: string,description: Repository path the token is scoped to; push to references under it.},token: {type: string,description: Bearer token to present to the registry.},scope: {type: string,description: "Granted access, for example `repository:acme/*:pull,push`."},expiresAt: {type: string,format: date-time}},required: [registry,repository,token,scope,expiresAt]}}}}},security: [{identity: []}]}},/v1/deployments: {get: {summary: List deployments,description: "Deployments of the environment, newest first, optionally for one service.",operationId: deployments,responses: {"200": {description: List deployments,content: {application/json: {schema: {type: object,properties: {items: {type: array,items: {$ref: "#/components/schemas/Deployment"}}},required: [items]}}}}},parameters: [{name: env,in: query,required: true,schema: {type: string,enum: [prod,staging]}},{name: service,in: query,required: false,schema: {type: string}}],security: [{identity: []}]}},/v1/deployments/stats: {get: {summary: Summarize deployments,operationId: deploymentStats,responses: {"200": {description: Summarize deployments,content: {application/json: {schema: {type: object,properties: {env: {type: string,enum: [prod,staging]},services: {type: integer,format: int32},deployments: {type: integer,format: int32},ready: {type: integer,format: int32},failed: {type: integer,format: int32},lastDeployedAt: {type: string,format: date-time}},required: [env,services,deployments,ready,failed]}}}}},parameters: [{name: env,in: query,required: true,schema: {type: string,enum: [prod,staging]}}],security: [{identity: []}]}},/v1/deployments/rollback: {post: {summary: Roll a service back,description: "Starts a rollout of an earlier deployment, the previous one unless `to` names it.",operationId: rollback,requestBody: {content: {application/json: {schema: {type: object,properties: {env: {type: string,enum: [prod,staging]},service: {type: string},to: {type: string,description: Deployment id to roll back to; the previous one when absent.}},required: [env,service]}}},required: true},responses: {"202": {description: Roll a service back,content: {application/json: {schema: {type: object,properties: {id: {type: string},service: {type: string},env: {type: string,enum: [prod,staging]},status: {type: string,enum: [pending,rolling,ready,failed,rolled-back]},component: {$ref: "#/components/schemas/ComponentReference"},createdAt: {type: string,format: date-time},readyAt: {type: string,format: date-time}},required: [id,service,env,status,component,createdAt]}}}}},security: [{identity: []}]}},/v1/secrets: {get: {summary: List secrets,description: Names and update times only; secret values are never returned.,operationId: secrets,responses: {"200": {description: List secrets,content: {application/json: {schema: {type: object,properties: {env: {type: string,enum: [prod,staging]},items: {type: array,items: {$ref: "#/components/schemas/SecretEntry"}}},required: [env,items]}}}}},parameters: [{name: env,in: query,required: true,schema: {type: string,enum: [prod,staging]}}],security: [{identity: []}]}},"/v1/secrets/{name}": {put: {summary: Set a secret,description: Creates or replaces the secret. The CLI reads the value from a file or stdin so it stays out of shell history.,operationId: setSecret,requestBody: {content: {application/json: {schema: {type: object,properties: {value: {type: string}},required: [value]}}},required: true},responses: {"204": {description: Set a secret}},parameters: [{name: name,in: path,required: true,schema: {type: string}},{name: env,in: query,required: true,schema: {type: string,enum: [prod,staging]}}],security: [{identity: []}]},delete: {summary: Unset a secret,operationId: unsetSecret,responses: {"204": {description: Unset a secret}},parameters: [{name: name,in: path,required: true,schema: {type: string}},{name: env,in: query,required: true,schema: {type: string,enum: [prod,staging]}}],security: [{identity: []}]},patch: {summary: Update a secret,description: Replaces the value of an existing secret; 404 when it does not exist.,operationId: updateSecret,requestBody: {content: {application/json: {schema: {type: object,properties: {value: {type: string}},required: [value]}}},required: true},responses: {"204": {description: Update a secret}},parameters: [{name: name,in: path,required: true,schema: {type: string}},{name: env,in: query,required: true,schema: {type: string,enum: [prod,staging]}}],security: [{identity: []}]}},/v1/services: {post: {summary: Create a service,description: "Creates an http, cron, or worker service in the environment. Type-specific fields follow the type.",operationId: createService,requestBody: {content: {application/json: {schema: {type: object,description: "Type-specific fields follow the type: `port` and `route` for http, `schedule` for cron, `command` for worker.",properties: {env: {type: string,enum: [prod,staging]},type: {type: string,enum: [http,cron,worker]},name: {type: string},port: {type: integer,format: int32},route: {type: string,description: Public route pattern for an http service.},schedule: {type: string,description: Cron expression for a cron service.},command: {type: array,items: {type: string},description: Entry command of a worker service.}},required: [env,type,name]}}},required: true},responses: {"201": {description: Create a service,content: {application/json: {schema: {type: object,properties: {name: {type: string},env: {type: string,enum: [prod,staging]},type: {type: string,enum: [http,cron,worker]},route: {type: string},port: {type: integer,format: int32},schedule: {type: string},command: {type: array,items: {type: string}},createdAt: {type: string,format: date-time}},required: [name,env,type,createdAt]}}}}},security: [{identity: []}]}},"/v1/services/{service}/logs": {get: {summary: Read or follow service logs,description: "Server-sent events (`text/event-stream`). Each `log` event carries one LogEvent as JSON; an `end` event closes the stream. With `follow` the stream stays open until the client disconnects.",operationId: logs,responses: {"200": {description: Read or follow service logs,content: {application/json: {schema: {type: object,description: "One line of a service log. Streamed as `text/event-stream`: each SSE `data:` field is one LogEvent as JSON; the `event:` field is `log`, or `end` when the stream closes.",properties: {timestamp: {type: string,format: date-time},deployment: {type: string},instance: {type: string},level: {type: string,enum: [debug,info,warn,error]},message: {type: string}},required: [timestamp,deployment,message]}}}}},parameters: [{name: service,in: path,required: true,schema: {type: string}},{name: env,in: query,required: true,schema: {type: string,enum: [prod,staging]}},{name: deployment,in: query,required: false,schema: {type: string}},{name: follow,in: query,required: false,schema: {type: boolean,default: false}},{name: since,in: query,required: false,schema: {type: string,description: "Duration such as 10m or 1h, or an RFC 3339 timestamp."}},{name: tail,in: query,required: false,schema: {type: integer,format: int32,default: 100}}],security: [{identity: []}]}},"/v1/services/{service}/proxy": {post: {summary: Open a tunnel to a service,description: Issues a short-lived tunnel session to one port of the service. The session URL takes the same bearer.,operationId: proxy,requestBody: {content: {application/json: {schema: {type: object,properties: {env: {type: string,enum: [prod,staging]},port: {type: integer,format: int32,description: Service port to tunnel to; the service default when absent.}},required: [env]}}},required: true},responses: {"201": {description: Open a tunnel to a service,content: {application/json: {schema: {type: object,description: "A short-lived tunnel to one service. The CLI connects to `url` with the same bearer; the tunnel transport is WebSocket and is described outside this document.",properties: {url: {type: string,format: uri},port: {type: integer,format: int32},expiresAt: {type: string,format: date-time}},required: [url,port,expiresAt]}}}}},parameters: [{name: service,in: path,required: true,schema: {type: string}}],security: [{identity: []}]}},"/v1/vars/{name}": {put: {summary: Set a var,description: Creates or replaces the var. The CLI reads the value from a file or stdin so it stays out of shell history.,operationId: setVar,requestBody: {content: {application/json: {schema: {type: object,properties: {value: {type: string}},required: [value]}}},required: true},responses: {"204": {description: Set a var}},parameters: [{name: name,in: path,required: true,schema: {type: string}},{name: env,in: query,required: true,schema: {type: string,enum: [prod,staging]}}],security: [{identity: []}]},delete: {summary: Unset a var,operationId: unsetVar,responses: {"204": {description: Unset a var}},parameters: [{name: name,in: path,required: true,schema: {type: string}},{name: env,in: query,required: true,schema: {type: string,enum: [prod,staging]}}],security: [{identity: []}]},patch: {summary: Update a var,description: Replaces the value of an existing var; 404 when it does not exist.,operationId: updateVar,requestBody: {content: {application/json: {schema: {type: object,properties: {value: {type: string}},required: [value]}}},required: true},responses: {"204": {description: Update a var}},parameters: [{name: name,in: path,required: true,schema: {type: string}},{name: env,in: query,required: true,schema: {type: string,enum: [prod,staging]}}],security: [{identity: []}]}},/v1/vars: {get: {summary: List vars,description: "Names, values, and update times of the environment variables.",operationId: vars,responses: {"200": {description: List vars,content: {application/json: {schema: {type: object,properties: {env: {type: string,enum: [prod,staging]},items: {type: array,items: {$ref: "#/components/schemas/ConfigEntry"}}},required: [env,items]}}}}},parameters: [{name: env,in: query,required: true,schema: {type: string,enum: [prod,staging]}}],security: [{identity: []}]}}},components: {schemas: {Empty: {type: object},Problem: {type: object,description: RFC 9457 problem details; every error response uses it.,properties: {type: {type: string},title: {type: string},status: {type: integer,format: int32},detail: {type: string}},required: [title,status]},AuthInfo: {type: object,description: "What a CLI needs before it holds a credential: the account this controller serves and the identity server to log in with.",properties: {account: {type: string},issuer: {type: string,format: uri},clientId: {type: string}},required: [account,issuer,clientId]},Principal: {type: object,properties: {user: {type: string},account: {type: string},role: {type: string,enum: [developer,viewer]},via: {type: string,enum: [identity,api-key]},credentialId: {type: string}},required: [user,account,role,via]},ComponentReference: {type: object,description: The built component the controller pulls from the platform registry.,properties: {reference: {type: string,description: OCI reference the component was pushed as.},digest: {type: string,description: sha256 digest of the pushed artifact.}},required: [reference,digest]},Binding: {type: object,description: "One `@WasmCloudBinding` of the component, rendered by the CLI.",properties: {name: {type: string},capability: {type: string},serviceName: {type: string,description: Backing service the binding attaches to.},config: {type: object,additionalProperties: {type: string}}},required: [name,capability]},DeployBundle: {type: object,description: Everything the CLI renders client-side. The controller validates it at the boundary and never receives a kubeconfig or a namespace.,properties: {env: {type: string,enum: [prod,staging]},service: {type: string,description: Service the deployment belongs to.},component: {$ref: "#/components/schemas/ComponentReference"},workload: {type: object,description: "The rendered WorkloadDeployment template, without namespace or host selector.",additionalProperties: true},bindings: {type: array,items: {$ref: "#/components/schemas/Binding"}},secrets: {type: array,description: Names of tenant secrets the workload references; values never travel.,items: {type: string}}},required: [env,service,component,workload,bindings,secrets]},PushCredential: {type: object,description: "A short-lived bearer token for the registry token-auth flow, scoped to the tenant repository path. It is never a shared registry secret.",properties: {registry: {type: string,description: Registry host the token is valid for.},repository: {type: string,description: Repository path the token is scoped to; push to references under it.},token: {type: string,description: Bearer token to present to the registry.},scope: {type: string,description: "Granted access, for example `repository:acme/*:pull,push`."},expiresAt: {type: string,format: date-time}},required: [registry,repository,token,scope,expiresAt]},DeployChange: {type: object,properties: {kind: {type: string,enum: [create,update,unchanged,delete]},resource: {type: string},name: {type: string},detail: {type: string}},required: [kind,resource,name]},DeployPlan: {type: object,description: What applying the bundle would change.,properties: {env: {type: string,enum: [prod,staging]},service: {type: string},changes: {type: array,items: {$ref: "#/components/schemas/DeployChange"}}},required: [env,service,changes]},Deployment: {type: object,properties: {id: {type: string},service: {type: string},env: {type: string,enum: [prod,staging]},status: {type: string,enum: [pending,rolling,ready,failed,rolled-back]},component: {$ref: "#/components/schemas/ComponentReference"},createdAt: {type: string,format: date-time},readyAt: {type: string,format: date-time}},required: [id,service,env,status,component,createdAt]},DeploymentList: {type: object,properties: {items: {type: array,items: {$ref: "#/components/schemas/Deployment"}}},required: [items]},DeploymentStats: {type: object,properties: {env: {type: string,enum: [prod,staging]},services: {type: integer,format: int32},deployments: {type: integer,format: int32},ready: {type: integer,format: int32},failed: {type: integer,format: int32},lastDeployedAt: {type: string,format: date-time}},required: [env,services,deployments,ready,failed]},RollbackRequest: {type: object,properties: {env: {type: string,enum: [prod,staging]},service: {type: string},to: {type: string,description: Deployment id to roll back to; the previous one when absent.}},required: [env,service]},CreateServiceRequest: {type: object,description: "Type-specific fields follow the type: `port` and `route` for http, `schedule` for cron, `command` for worker.",properties: {env: {type: string,enum: [prod,staging]},type: {type: string,enum: [http,cron,worker]},name: {type: string},port: {type: integer,format: int32},route: {type: string,description: Public route pattern for an http service.},schedule: {type: string,description: Cron expression for a cron service.},command: {type: array,items: {type: string},description: Entry command of a worker service.}},required: [env,type,name]},Service: {type: object,properties: {name: {type: string},env: {type: string,enum: [prod,staging]},type: {type: string,enum: [http,cron,worker]},route: {type: string},port: {type: integer,format: int32},schedule: {type: string},command: {type: array,items: {type: string}},createdAt: {type: string,format: date-time}},required: [name,env,type,createdAt]},LogEvent: {type: object,description: "One line of a service log. Streamed as `text/event-stream`: each SSE `data:` field is one LogEvent as JSON; the `event:` field is `log`, or `end` when the stream closes.",properties: {timestamp: {type: string,format: date-time},deployment: {type: string},instance: {type: string},level: {type: string,enum: [debug,info,warn,error]},message: {type: string}},required: [timestamp,deployment,message]},ConfigEntry: {type: object,description: A secret lists its name only; a var also carries its value.,properties: {name: {type: string},value: {type: string},updatedAt: {type: string,format: date-time}},required: [name,updatedAt]},ConfigList: {type: object,properties: {env: {type: string,enum: [prod,staging]},items: {type: array,items: {$ref: "#/components/schemas/ConfigEntry"}}},required: [env,items]},SecretEntry: {type: object,description: A secret lists its name and update time only; its value never travels on read.,properties: {name: {type: string},updatedAt: {type: string,format: date-time}},required: [name,updatedAt],additionalProperties: false},SecretList: {type: object,properties: {env: {type: string,enum: [prod,staging]},items: {type: array,items: {$ref: "#/components/schemas/SecretEntry"}}},required: [env,items]},ConfigValue: {type: object,properties: {value: {type: string}},required: [value]},ProxyRequest: {type: object,properties: {env: {type: string,enum: [prod,staging]},port: {type: integer,format: int32,description: Service port to tunnel to; the service default when absent.}},required: [env]},ProxySession: {type: object,description: "A short-lived tunnel to one service. The CLI connects to `url` with the same bearer; the tunnel transport is WebSocket and is described outside this document.",properties: {url: {type: string,format: uri},port: {type: integer,format: int32},expiresAt: {type: string,format: date-time}},required: [url,port,expiresAt]}},securitySchemes: {identity: {type: http,scheme: bearer,description: "An identity-server access token for a member of this account, or a tenant API key (`dik_…`). Obtained by the CLI login; never passed as an argument."}}}}