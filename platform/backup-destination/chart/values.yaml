image:
  repository: di-framework/backup-destination
  tag: dev
  pullPolicy: IfNotPresent
agentImage: di-framework/backup-agent:dev
# s3, pvc, or both. With both, BackupDestination default is S3 and BackupDestination pvc is the
# claim; both use the schedule and retention below.
type: s3
bucket: ""
prefix: ""
region: us-east-1
endpoint: ""
# Required, no default: a five-field UTC cron for BackingService dumps (for example "0 2 * * *"),
# or "none" for on-demand backups only (console Backup now / backup-now annotation). Rendering
# fails while it is unset.
schedule: ""
retentionSuccessful: 14
existingSecret: ""
accessKeyId: ""
secretAccessKey: ""
# PVC destination: an existing claim in di-runtime-<tenant>, or a size (and optional storage
# class) for the chart to create claim di-backup-pvc there. A created claim survives uninstall.
existingClaimName: ""
volumeClaimTemplate:
  storageClassName: ""
  size: ""
# The platform's storageRoot: workload volumes live in
# <storageRoot>/di-tenants/<tenant uid>/workloads/<key> on the node. Leave it empty and the
# operator takes it from the path the tenant host pods mount, which always matches the
# platform. Set it (Kubesolo: /var/lib/kubesolo, k0s: /var/lib/k0s) to also require that path.
storageRoot: ""
# Workload volumes to copy cold (#232). Each entry:
#   workloadName: identity          # a WorkloadDeployment with platform storage (required)
#   schedule: "30 3 * * *"          # required: UTC cron, or "none" for on-demand backups only
#   retention:                      # leave it out to keep every backup
#     keepLast: 7
#     daily: 7
#     weekly: 4
#     monthly: 6
#     failed: 5
#   scaleDownTimeoutSeconds: 300    # optional
#   copyTimeoutSeconds: 3600        # optional
#   startTimeoutSeconds: 120        # optional: probe and copy Job start deadline
#   resources:                      # optional: copy Job; default 50m/64Mi, limit 100m/128Mi
#     limits: { cpu: "1", memory: 512Mi }
#   destination: pvc                # s3 or pvc; required when type is both
# There is no default schedule and no default retention.
sources: []
extraEgress: []
apiEgress:
  - cidr: 10.43.0.0/16
    port: 443
  - cidr: 172.16.0.0/12
    port: 6443
