apiVersion: v1
kind: ServiceAccount
metadata:
  name: di-backup-operator
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: di-backup-operator
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["platform.di-framework.dev"]
    resources: ["backupdestinations", "backuprestores", "backups", "backingservices"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["platform.di-framework.dev"]
    resources: ["backupdestinations/status", "backuprestores/status", "backups/status"]
    verbs: ["get", "patch", "update"]
  {{- $secret := include "backup.s3Secret" . | trim }}
  {{- if $secret }}
  # Only the S3 credentials Secret this release's destination names; never a list.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secret | quote }}]
    verbs: ["get"]
  {{- end }}
  # The held-replicas ledger (#232): the replicas a workload-volume copy holds at 0, kept
  # outside the Backup so a deleted Backup cannot strand them. create cannot be name-scoped.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["di-backup-held-replicas"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  # One reconciler at a time across operator pods.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["di-backup-operator"]
    verbs: ["get", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  # Workload volumes (#232): find a workload's instances and hold its replicas at 0 while its
  # volume is copied. Only the scale subresource is writable; the spec is not.
  - apiGroups: ["runtime.wasmcloud.dev"]
    resources: ["workloaddeployments", "workloadreplicasets", "workloads"]
    verbs: ["get", "list"]
  - apiGroups: ["runtime.wasmcloud.dev"]
    resources: ["workloaddeployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: di-backup-operator
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: di-backup-operator
subjects:
  - kind: ServiceAccount
    name: di-backup-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: di-backup-operator
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  # Never two operator pods at once; the Lease covers anything that still overlaps.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: di-backup-operator
  template:
    metadata:
      labels:
        app: di-backup-operator
        platform.di-framework.dev/component: backup-operator
    spec:
      serviceAccountName: di-backup-operator
      containers:
        - name: operator
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TENANT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AGENT_IMAGE
              value: {{ .Values.agentImage | quote }}
            # Empty: taken from the path the tenant host pods mount.
            - name: STORAGE_ROOT
              value: {{ .Values.storageRoot | default "" | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: di-backup-operator-network
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      platform.di-framework.dev/component: backup-operator
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values: ["kube-dns", "coredns"]
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range .Values.apiEgress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: di-backup-console
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: di-backup-operator
  ports:
    - name: http
      port: 8080
      targetPort: http
