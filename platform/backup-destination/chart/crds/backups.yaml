apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backupdestinations.platform.di-framework.dev
spec:
  group: platform.di-framework.dev
  scope: Namespaced
  names:
    kind: BackupDestination
    listKind: BackupDestinationList
    plural: backupdestinations
    singular: backupdestination
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "self.type != 's3' || (has(self.bucket) && has(self.credentialsSecretRef) && has(self.credentialsSecretRef.name))"
                  message: an s3 destination needs bucket and credentialsSecretRef.name
                - rule: "self.type != 'pvc' || has(self.existingClaimName) || (has(self.volumeClaimTemplate) && has(self.volumeClaimTemplate.size))"
                  message: a pvc destination needs existingClaimName or volumeClaimTemplate.size
                - rule: "self.type == oldSelf.type"
                  message: type is immutable; create another BackupDestination instead
              properties:
                type:
                  type: string
                  enum: ['s3', 'pvc']
                  # Destinations created before #233 have no type; they are S3.
                  default: s3
                bucket: { type: string, minLength: 1 }
                prefix:
                  type: string
                  # CEL cost is estimated from maxLength; without it the API server rejects the CRD.
                  maxLength: 1024
                  x-kubernetes-validations:
                    - rule: "!self.split('/').exists(p, p == '..' || p == '.')"
                      message: prefix must not contain . or .. segments
                    - rule: "self == '' || self.split('/').exists(p, p != '')"
                      message: prefix must contain a non-empty segment
                    - rule: '!oldSelf.hasValue() || oldSelf.value() == '''' || self == oldSelf.value()'
                      message: prefix is immutable once set
                      optionalOldSelf: true
                region: { type: string }
                endpoint:
                  type: string
                  maxLength: 2048
                  x-kubernetes-validations:
                    - rule: 'self == '''' || self.startsWith(''https://'') || ((self.startsWith(''http://'') && (self.contains(''.svc.cluster.local'') || self.contains(''localhost''))))'
                      message: HTTP is only allowed for cluster-local endpoints
                credentialsSecretRef:
                  type: object
                  properties:
                    name: { type: string, minLength: 1 }
                # A claim in the runtime namespace (di-runtime-<tenant>), where agent Jobs run.
                existingClaimName: { type: string, minLength: 1 }
                # Read by the chart, which creates claim di-backup-pvc. The operator creates no claims.
                volumeClaimTemplate:
                  type: object
                  properties:
                    storageClassName: { type: string }
                    size: { type: string, minLength: 1 }
                schedule: { type: string }
                retention:
                  type: object
                  properties:
                    successful: { type: integer, minimum: 1 }
                extraEgress:
                  type: array
                  items:
                    type: object
                    required: [cidr, port]
                    properties:
                      cidr: { type: string }
                      port: { type: integer, minimum: 1, maximum: 65535 }
                      protocol: { type: string }
                suspend: { type: boolean }
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items: { type: object, x-kubernetes-preserve-unknown-fields: true }
                observedGeneration: { type: integer }
                lastAttemptTime: { type: string }
                lastSuccessTime: { type: string }
                enrolledServices: { type: integer }
                skipped: { type: integer }
                services:
                  type: array
                  items: { type: object, x-kubernetes-preserve-unknown-fields: true }
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.platform.di-framework.dev
spec:
  group: platform.di-framework.dev
  scope: Namespaced
  names:
    kind: Backup
    listKind: BackupList
    plural: backups
    singular: backup
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [serviceName, destinationName, uid, type, className]
              properties:
                serviceName: { type: string }
                destinationName: { type: string }
                uid: { type: string }
                type: { type: string }
                className: { type: string }
                parameters: { type: object, x-kubernetes-preserve-unknown-fields: true }
                tool: { type: string }
                format: { type: string }
              x-kubernetes-validations:
                - rule: 'self.serviceName == oldSelf.serviceName && self.uid == oldSelf.uid && self.type == oldSelf.type && self.className == oldSelf.className'
                  message: backup identity is immutable
            status:
              type: object
              properties:
                phase: { type: string }
                digest: { type: string }
                bytes: { type: integer }
                objectKey: { type: string }
                reason: { type: string }
                message: { type: string }
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backuprestores.platform.di-framework.dev
spec:
  group: platform.di-framework.dev
  scope: Namespaced
  names:
    kind: BackupRestore
    listKind: BackupRestoreList
    plural: backuprestores
    singular: backuprestore
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [sourceBackupName, targetServiceName]
              properties:
                sourceBackupName: { type: string, minLength: 1 }
                targetServiceName:
                  type: string
                  pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
            status:
              type: object
              properties:
                phase: { type: string }
                reason: { type: string }
                message: { type: string }
