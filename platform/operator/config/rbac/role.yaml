---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-operator
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.di-framework.dev
  resources:
  - platforminstances
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.di-framework.dev
  resources:
  - platforminstances/finalizers
  verbs:
  - update
- apiGroups:
  - platform.di-framework.dev
  resources:
  - platforminstances/status
  verbs:
  - get
  - patch
  - update
