---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: platforminstances.platform.di-framework.dev
spec:
  group: platform.di-framework.dev
  names:
    kind: PlatformInstance
    listKind: PlatformInstanceList
    plural: platforminstances
    shortNames:
    - pi
    singular: platforminstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.installedVersion
      name: Installed
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PlatformInstance is one isolated copy of the di-framework platform.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PlatformInstanceSpec is the desired platform instance. The target and storageRoot are fixed at
              creation: the operator would otherwise lose track of the cluster and data it made.
            properties:
              deletionPolicy:
                default: Delete
                description: DeletionPolicy is Delete (default) or Retain.
                enum:
                - Delete
                - Retain
                type: string
              platform:
                description: Platform holds the platform settings the operator passes
                  to the install.
                properties:
                  gateway:
                    description: Gateway configures the platform HTTP gateway.
                    properties:
                      httpEndpoint:
                        description: |-
                          HTTPEndpoint is the gateway's public base URL, for example http://apps.example:30080. The
                          platform derives route URLs from it, and status.endpoints.http reports it. The operator
                          can't know how the gateway is reached from outside, so it is set here.
                        pattern: ^https?://
                        type: string
                      httpNodePort:
                        description: HTTPNodePort publishes the gateway on this NodePort.
                          Zero (default) keeps it ClusterIP.
                        format: int32
                        maximum: 32767
                        minimum: 0
                        type: integer
                    type: object
                  networkPolicyEngine:
                    default: existing
                    description: |-
                      NetworkPolicyEngine is existing (default: the target enforces NetworkPolicy) or
                      kube-router (the platform runs its own policy controller).
                    enum:
                    - existing
                    - kube-router
                    type: string
                  storageRoot:
                    description: |-
                      StorageRoot is the node path under which the platform keeps tenant data. Empty uses the
                      operator's per-instance default, which deletionPolicy Delete removes. The operator didn't
                      create a path set here, so it never removes it.
                    type: string
                  tenantAuth:
                    description: |-
                      TenantAuth enables the per-tenant console and /v1 API against an OIDC issuer (the
                      platform's `tenantAuth` config). Unset, tenants get no console.
                    properties:
                      clientId:
                        description: ClientID is the console's confidential OAuth
                          client (oauthClient.id).
                        maxLength: 253
                        minLength: 1
                        type: string
                      clientSecretRef:
                        description: |-
                          ClientSecretRef names the Secret, in the PlatformInstance's namespace, and its key that
                          hold the OAuth client secret.
                        properties:
                          key:
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      consolePublicUrl:
                        description: ConsolePublicURL is the browser-visible console
                          URL; {tenant} is replaced.
                        maxLength: 2048
                        pattern: ^https?://
                        type: string
                      controllerPublicUrl:
                        description: ControllerPublicURL is the controller URL shown
                          to users and CLIs; {tenant} is replaced.
                        maxLength: 2048
                        pattern: ^https?://
                        type: string
                      image:
                        description: Image is the tenant-auth image, pinned by digest
                          (<repository>@sha256:<digest>).
                        maxLength: 512
                        pattern: ^[^@\s]+@sha256:[0-9a-f]{64}$
                        type: string
                      issuer:
                        description: Issuer is the OIDC issuer URL, as both pods and
                          browsers name it.
                        maxLength: 2048
                        pattern: ^https?://
                        type: string
                      issuerIp:
                        description: IssuerIP is the issuer's IPv4 when pods cannot
                          resolve its hostname.
                        maxLength: 15
                        type: string
                      issuerUpstream:
                        description: |-
                          IssuerUpstream is the in-cluster <service>.<namespace>[.svc...]:<port> a sidecar forwards a
                          loopback issuer's port to.
                        maxLength: 512
                        type: string
                      issuerUpstreamPodPort:
                        description: IssuerUpstreamPodPort is the pod port behind
                          issuerUpstream.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      registry:
                        description: Registry deploys each tenant's own OCI registry.
                        properties:
                          component:
                            description: Component is the oci-registry component,
                              pinned by digest.
                            maxLength: 512
                            pattern: ^[^@\s]+@sha256:[0-9a-f]{64}$
                            type: string
                          limits:
                            description: Limits bound the controller's registry front.
                            properties:
                              maxBodyBytes:
                                format: int64
                                minimum: 1
                                type: integer
                              maxConcurrent:
                                format: int64
                                minimum: 1
                                type: integer
                              uploadIdleTimeoutMs:
                                format: int64
                                minimum: 1
                                type: integer
                              upstreamTimeoutMs:
                                format: int64
                                minimum: 1
                                type: integer
                            type: object
                          publicUrl:
                            description: PublicURL is the registry origin users log
                              in to; {tenant} is replaced.
                            maxLength: 2048
                            pattern: ^https?://
                            type: string
                        required:
                        - component
                        type: object
                    required:
                    - image
                    type: object
                    x-kubernetes-validations:
                    - message: tenantAuth needs issuer, clientId and clientSecretRef
                        together
                      rule: has(self.issuer) && has(self.clientId) && has(self.clientSecretRef)
                  tenantHostImage:
                    description: |-
                      TenantHostImage is the platform's `tenantHostImage`. Empty uses the operator's pinned
                      exclusive host variant (ghcr.io/di-framework/wash:2.8.0-wasi-tls-exclusive by digest), which
                      the PGlite exclusive-PGDATA workloads need. Fixed at creation.
                    maxLength: 512
                    pattern: ^[^\s@]+(@sha256:[0-9a-f]{64})?$
                    type: string
                  tenantHostImagePullPolicy:
                    description: |-
                      TenantHostImagePullPolicy is the platform's `tenantHostImagePullPolicy` (the platform
                      defaults to IfNotPresent).
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  tenants:
                    description: |-
                      Tenants are the platform's tenants (its `tenants` config). A change on a Ready instance is
                      applied by the install the spec change starts.
                    items:
                      description: Tenant is one entry of the platform's `tenants`
                        config.
                      properties:
                        deletionPolicy:
                          description: |-
                            DeletionPolicy is what removing the tenant does to its data: Retain or Delete (the
                            platform's default applies when unset).
                          enum:
                          - Retain
                          - Delete
                          type: string
                        name:
                          description: Name is 1-40 lowercase letters, digits and
                            hyphens, starting with a letter.
                          maxLength: 40
                          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
                          type: string
                        resources:
                          description: Resources are the tenant's quotas.
                          properties:
                            apiKeys:
                              format: int32
                              minimum: 0
                              type: integer
                            backingServices:
                              format: int32
                              minimum: 0
                              type: integer
                            cpu:
                              maxLength: 32
                              type: string
                            memory:
                              maxLength: 32
                              type: string
                            serviceBindings:
                              format: int32
                              minimum: 0
                              type: integer
                            workloads:
                              format: int32
                              minimum: 0
                              type: integer
                          type: object
                        runtime:
                          description: Runtime sizes the tenant's hosts.
                          properties:
                            coreInstances:
                              description: CoreInstances is WASH_CORE_INSTANCES for
                                the tenant host (platform default 100).
                              format: int32
                              maximum: 10000
                              minimum: 1
                              type: integer
                            replicas:
                              format: int32
                              minimum: 0
                              type: integer
                          type: object
                        suspended:
                          description: Suspended suspends the tenant.
                          type: boolean
                      required:
                      - name
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  users:
                    description: Users are the platform's users and their tenant memberships
                      (its `users` config).
                    items:
                      description: User is one entry of the platform's `users` config.
                      properties:
                        memberships:
                          description: Memberships are the tenants the user belongs
                            to, one entry per tenant.
                          items:
                            description: Membership puts a user in a tenant.
                            properties:
                              role:
                                description: MembershipRole is a user's role in a
                                  tenant.
                                enum:
                                - developer
                                - viewer
                                type: string
                              tenant:
                                description: Tenant names an entry of spec.platform.tenants.
                                maxLength: 40
                                type: string
                            required:
                            - role
                            - tenant
                            type: object
                          maxItems: 32
                          type: array
                          x-kubernetes-list-map-keys:
                          - tenant
                          x-kubernetes-list-type: map
                        name:
                          description: Name is 1-40 lowercase letters, digits and
                            hyphens, starting with a letter.
                          maxLength: 40
                          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
                          type: string
                        suspended:
                          description: Suspended blocks the user's access.
                          type: boolean
                      required:
                      - memberships
                      - name
                      type: object
                    maxItems: 256
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
                x-kubernetes-validations:
                - message: every users[].memberships[].tenant must name an entry of
                    tenants
                  rule: '!has(self.users) || self.users.all(u, u.memberships.all(m,
                    has(self.tenants) && self.tenants.exists(t, t.name == m.tenant)))'
              target:
                description: Target is where the instance runs.
                properties:
                  type:
                    description: Type is the target kind. Only vcluster is supported
                      in v1alpha1.
                    enum:
                    - vcluster
                    type: string
                required:
                - type
                type: object
              version:
                description: Version is the exact @di-framework/platform package version
                  to install, for example 6.0.17.
                pattern: ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$
                type: string
            required:
            - target
            - version
            type: object
            x-kubernetes-validations:
            - message: target is immutable
              rule: self.target == oldSelf.target
            - message: platform.storageRoot is immutable
              rule: 'has(self.platform) && has(self.platform.storageRoot) ? has(oldSelf.platform)
                && has(oldSelf.platform.storageRoot) && oldSelf.platform.storageRoot
                == self.platform.storageRoot : !(has(oldSelf.platform) && has(oldSelf.platform.storageRoot))'
            - message: 'platform.tenantHostImage is immutable in v1alpha1: it is fixed
                at creation (empty uses the operator''s pinned exclusive host image)'
              rule: 'has(self.platform) && has(self.platform.tenantHostImage) ? has(oldSelf.platform)
                && has(oldSelf.platform.tenantHostImage) && oldSelf.platform.tenantHostImage
                == self.platform.tenantHostImage : !(has(oldSelf.platform) && has(oldSelf.platform.tenantHostImage))'
          status:
            description: PlatformInstanceStatus is the observed state of an instance.
            properties:
              applied:
                description: Applied summarizes the platform settings the last successful
                  install applied.
                properties:
                  generation:
                    description: Generation is the metadata.generation whose settings
                      were applied.
                    format: int64
                    type: integer
                  tenantAuthIssuer:
                    description: TenantAuthIssuer is the applied tenantAuth issuer;
                      empty without tenantAuth.
                    type: string
                  tenantHostImage:
                    description: TenantHostImage is the applied tenant host image.
                    type: string
                  tenants:
                    description: Tenants is the number of applied tenants.
                    format: int32
                    type: integer
                  users:
                    description: Users is the number of applied users.
                    format: int32
                    type: integer
                required:
                - generation
                - tenants
                - users
                type: object
              conditions:
                description: Conditions carry readable reasons for each part of the
                  reconcile.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoints:
                description: Endpoints are the instance's published URLs, from the
                  install's outputs.
                properties:
                  http:
                    type: string
                  kubernetes:
                    type: string
                type: object
              installedVersion:
                description: InstalledVersion is the platform version the last successful
                  install applied.
                type: string
              kubeconfigSecretRef:
                description: |-
                  KubeconfigSecretRef names the Secret, in the PlatformInstance's namespace, that holds the
                  instance's admin kubeconfig under the key "kubeconfig".
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              lastRepair:
                description: LastRepair is when the last periodic refresh and up finished.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
              phase:
                description: Phase is the coarse lifecycle state.
                enum:
                - Pending
                - Provisioning
                - Installing
                - Ready
                - Failed
                - Deleting
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: name must be at most 63 characters
          rule: self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
