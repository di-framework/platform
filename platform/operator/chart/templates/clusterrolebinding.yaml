# The controller's own permissions (clusterrole.yaml, generated from config/rbac).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "platform-operator.fullname" . }}
  labels:
    {{- include "platform-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "platform-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.clusterAdmin }}
---
# Required in v1alpha1: the operator installs the vCluster chart with Helm, which creates RBAC,
# workloads and Services in each instance's host namespace, and Kubernetes only lets Helm grant
# permissions it already holds. Narrowing this is follow-up work (see the chart README).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "platform-operator.fullname" . }}-cluster-admin
  labels:
    {{- include "platform-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ include "platform-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
