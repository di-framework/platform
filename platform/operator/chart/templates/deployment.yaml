apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The state claim is ReadWriteOnce: the old pod lets go of it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "platform-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform-operator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "platform-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          image: {{ include "platform-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --state-dir=/var/lib/platform-operator
            - --passphrase-file=/etc/platform-operator/passphrase
            - --storage-root-base={{ .Values.storageRootBase }}
            - --repair-interval={{ .Values.repairInterval }}
            - --target-poll={{ .Values.targetPoll }}
            - --install-timeout={{ .Values.installTimeout }}
            - --max-concurrent-installs={{ .Values.maxConcurrentInstalls }}
            - --leader-elect={{ .Values.leaderElect }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            {{- with .Values.cleanupNamespace }}
            - --cleanup-namespace={{ . }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # The operator's own namespace, where it runs its storageRoot cleanup Jobs by default.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/platform-operator
            - name: passphrase
              mountPath: /etc/platform-operator
              readOnly: true
            - name: home
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "platform-operator.stateClaim" . }}
        - name: passphrase
          secret:
            secretName: {{ include "platform-operator.passphraseSecret" . }}
            items:
              - key: passphrase
                path: passphrase
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
