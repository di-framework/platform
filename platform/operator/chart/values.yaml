image:
  repository: ghcr.io/di-framework/platform-operator
  # The operator image is always pulled by digest, never by tag. The operator image pin PR (#271)
  # rewrites this placeholder with the digest each publish produced. Until then, set it at install
  # time: --set image.digest=sha256:<64 hex>. The chart refuses to render anything else, the
  # placeholder included, and the release workflow skips publishing the chart (with a warning)
  # while it still has it.
  digest: sha256:<pinned by the platform-operator image pin PR>
  pullPolicy: IfNotPresent
imagePullSecrets: []

# One operator is active at a time: extra replicas wait on the leader-election Lease. Each
# PlatformInstance has at most one Pulumi run in flight only while leader election is on, so the
# chart refuses replicaCount > 1 with leaderElect: false. With the default ReadWriteOnce state claim
# on a multi-node cluster, a standby replica scheduled on another node stays in ContainerCreating
# (Multi-Attach error) instead of waiting on the Lease; use a ReadWriteMany class or one replica.
replicaCount: 1
leaderElect: true

# The operator's flags (cmd/platform-operator/main.go). Durations use Go syntax (30m, 10s).
# Each instance's default storageRoot is <storageRootBase>/<namespace>/<name> on the node.
storageRootBase: /var/lib/kubesolo/instances
# Longest one install or repair may run before it is cancelled and retried.
installTimeout: 30m
# How often a Ready instance gets a refresh and up, which repairs drift.
repairInterval: 30m
# How often a target that is still coming up is checked.
targetPoll: 10s
# Instances reconciled in parallel. Each install runs `npm install` and Pulumi in the operator pod.
maxConcurrentInstalls: 2
# Where the operator runs the Jobs that remove a deleted instance's default storageRoot
# (--cleanup-namespace, from #426). Empty (the default) passes no flag and the operator uses its own
# namespace, the release namespace. Those Jobs mount <storageRootBase> with hostPath, so Pod
# Security admission must allow privileged pods in that namespace (see the chart README).
cleanupNamespace: ""
# Extra operator flags, such as the zap logging flags (--zap-log-level=debug).
extraArgs: []

# There are no values for the vCluster chart version, the vCluster values or a default platform
# version: the operator embeds the digest-checked vCluster chart and its KubeSolo defaults, and each
# PlatformInstance names its own spec.version. They change with the operator image.

# The operator's Pulumi state: per instance, the install project and a file backend. Losing it
# means Pulumi forgets what it installed, so the claim is kept on `helm uninstall`
# (helm.sh/resource-policy: keep). Back it up.
state:
  # An existing claim to use instead of the chart's. Requires passphrase.existingSecret: the chart
  # can't know the passphrase of state in a claim it didn't create, so it refuses to render without
  # one.
  existingClaim: ""
  size: 10Gi
  # Empty uses the cluster's default StorageClass.
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

# The passphrase that encrypts the secrets in the Pulumi state. Losing or changing it makes the
# state unreadable.
#   - existingSecret set: the chart creates no Secret and mounts that one (key `passphrase`).
#     Required for helm template, client-side --dry-run, Argo CD and other GitOps tools.
#   - existingSecret empty: the chart reads the cluster (lookup). It reuses the passphrase of its
#     Secret when it exists and generates one only when neither the Secret nor the state claim
#     exists (a claim without its Secret, or a Secret without the key, fails). It keeps the Secret on
#     `helm uninstall`. A render that cannot see the cluster fails instead of generating a new
#     passphrase that would overwrite the live one.
passphrase:
  existingSecret: ""

serviceAccount:
  # Empty uses the release's full name.
  name: ""
  annotations: {}

# RBAC: the chart binds two ClusterRoles to the operator's ServiceAccount.
#   - platform-operator: config/rbac/role.yaml, what the controller itself uses. Its name is fixed,
#     so (with the cluster-scoped CRD) the chart installs once per cluster.
#   - cluster-admin, when rbac.clusterAdmin is true: required in v1alpha1. The operator installs the
#     vCluster chart with Helm, and that chart creates RBAC, workloads and Services in each
#     instance's host namespace; Kubernetes only lets Helm grant permissions it already holds. Set
#     it to false only when you bind the ServiceAccount to an equivalent role yourself.
rbac:
  clusterAdmin: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 1Gi
  limits:
    memory: 2Gi
    ephemeral-storage: 6Gi

# Size limits of the writable emptyDirs: /home/node holds npm's cache and Pulumi's plugins, /tmp
# the rest. Together they must fit in the ephemeral-storage limit above.
emptyDirSizeLimit:
  home: 4Gi
  tmp: 1Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# The image runs as `node` (uid 1000) from the Dockerfile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
# The root filesystem is read-only: the chart mounts writable emptyDirs at /tmp and at /home/node
# (HOME: the npm cache and Pulumi's plugins).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Headlamp (the upstream chart, vendored in charts/) as the operator's UI. Off by default.
# Everything under `headlamp` is passed to that chart; see its values.yaml.
headlamp:
  enabled: false
  # The PlatformInstance Headlamp plugin (#273) is installed as a tarball by Headlamp's plugin
  # manager sidecar (`pluginctl install --config`). Until the plugin is published this is a stub:
  # to try a plugin, enable it and set configContent to the plugin list, for example
  #   pluginsManager:
  #     enabled: true
  #     configContent: |
  #       plugins:
  #         - name: platform-instances
  #           source: <where #273 publishes the plugin tarball>
  # (Upstream reads `pluginsManager` at the top of the Headlamp chart's values, so here it is
  # headlamp.pluginsManager, not headlamp.config.pluginsManager.)
  # Upstream defaults to `npx @headlamp-k8s/pluginctl@latest` on `node:lts-alpine`; both are pinned
  # here (the image by digest) so the sidecar is reproducible. It still needs npm egress.
  pluginsManager:
    enabled: false
    configContent: ""
    version: 0.1.1
    baseImage: node:24-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
