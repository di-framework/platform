# The vCluster values the proving-grounds Layer 3 run passed with inside a vCluster on KubeSolo
# (2026-10-17, run 2: 15/15, 4/4, 2/2). InstanceValues must render exactly these. Since then the
# CoreDNS image is pinned by digest (the multi-arch index of the same 1.14.2 tag the run used).
sync:
  toHost:
    networkPolicies:
      enabled: true
controlPlane:
  statefulSet:
    image:
      repository: loft-sh/vcluster-oss
  proxy:
    extraSANs: [127.0.0.1, localhost]
  coredns:
    overwriteConfig: |
      .:53 {
          errors
          health
          ready
          rewrite name regex .*\.nodes\.vcluster\.com kubernetes.default.svc.cluster.local
          kubernetes cluster.local in-addr.arpa ip6.arpa {
              pods insecure
              fallthrough in-addr.arpa ip6.arpa
          }
          hosts /etc/coredns/NodeHosts {
              ttl 60
              reload 15s
              fallthrough
          }
          prometheus :9153
          forward . 10.43.0.10
          cache 30
          loop
          reload
          loadbalance
      }

      import /etc/coredns/custom/*.server
    overwriteManifests: |
      apiVersion: v1
      kind: ServiceAccount
      metadata: {name: coredns, namespace: kube-system}
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: {name: "system:coredns"}
      rules:
        - apiGroups: [""]
          resources: [endpoints, services, pods, namespaces]
          verbs: [list, watch]
        - apiGroups: [discovery.k8s.io]
          resources: [endpointslices]
          verbs: [list, watch]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata: {name: "system:coredns"}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "system:coredns"}
      subjects: [{kind: ServiceAccount, name: coredns, namespace: kube-system}]
      ---
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: coredns, namespace: kube-system}
      data:
        NodeHosts: ""
        Corefile: |
          .:53 {
              errors
              health
              ready
              rewrite name regex .*\.nodes\.vcluster\.com kubernetes.default.svc.cluster.local
              kubernetes cluster.local in-addr.arpa ip6.arpa {
                  pods insecure
                  fallthrough in-addr.arpa ip6.arpa
              }
              hosts /etc/coredns/NodeHosts {
                  ttl 60
                  reload 15s
                  fallthrough
              }
              prometheus :9153
              forward . 10.43.0.10
              cache 30
              loop
              reload
              loadbalance
          }

          import /etc/coredns/custom/*.server
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: coredns
        namespace: kube-system
        labels: {k8s-app: kube-dns, kubernetes.io/name: CoreDNS}
      spec:
        replicas: 1
        strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1}}
        selector: {matchLabels: {k8s-app: kube-dns}}
        template:
          metadata: {labels: {k8s-app: kube-dns}}
          spec:
            serviceAccountName: coredns
            dnsPolicy: Default
            nodeSelector: {kubernetes.io/os: linux}
            containers:
              - name: coredns
                image: docker.io/coredns/coredns:1.14.2@sha256:e7e6440cfd1e919280958f5b5a6ab2b184d385bba774c12ad2a9e1e4183f90d9
                imagePullPolicy: IfNotPresent
                args: [-conf, /etc/coredns/Corefile]
                ports:
                  - {name: dns, containerPort: 53, protocol: UDP}
                  - {name: dns-tcp, containerPort: 53, protocol: TCP}
                  - {name: metrics, containerPort: 9153, protocol: TCP}
                livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 60, periodSeconds: 10, failureThreshold: 3}
                readinessProbe: {httpGet: {path: /ready, port: 8181}, periodSeconds: 2, failureThreshold: 3}
                resources:
                  limits: {cpu: 1000m, memory: 170Mi}
                  requests: {cpu: 20m, memory: 64Mi}
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: {add: [NET_BIND_SERVICE], drop: [ALL]}
                  readOnlyRootFilesystem: true
                  runAsGroup: 1001
                  runAsNonRoot: true
                  runAsUser: 1001
                volumeMounts:
                  - {name: config-volume, mountPath: /etc/coredns, readOnly: true}
                  - {name: custom-config-volume, mountPath: /etc/coredns/custom, readOnly: true}
            volumes:
              - name: config-volume
                configMap:
                  name: coredns
                  items: [{key: Corefile, path: Corefile}, {key: NodeHosts, path: NodeHosts}]
              - name: custom-config-volume
                configMap: {name: coredns-custom, optional: true}
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: kube-dns
        namespace: kube-system
        labels: {k8s-app: kube-dns, kubernetes.io/cluster-service: "true", kubernetes.io/name: CoreDNS}
      spec:
        selector: {k8s-app: kube-dns}
        ports:
          - {name: dns, port: 53, protocol: UDP, targetPort: 53}
          - {name: dns-tcp, port: 53, protocol: TCP, targetPort: 53}
          - {name: metrics, port: 9153, protocol: TCP, targetPort: 9153}
