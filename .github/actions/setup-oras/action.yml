# Installs the official ORAS CLI 1.3.4 release for the runner's architecture. setup-oras at
# the pinned SHA ships a release table that stops before 1.3.4, so its `version` input fails;
# its `url` + `checksum` inputs skip the table and verify the tarball's sha256 instead. The
# checksums come from
# https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_checksums.txt.
name: Set up ORAS
description: Install the ORAS CLI 1.3.4 (linux amd64 or arm64), verified by sha256.
runs:
  using: composite
  steps:
    - name: Select ORAS release asset
      id: asset
      shell: bash
      env:
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        version=1.3.4
        if [[ "${RUNNER_OS_NAME}" != "Linux" ]]; then
          echo "::error::setup-oras: unsupported runner OS ${RUNNER_OS_NAME}" >&2
          exit 1
        fi
        case "${RUNNER_ARCH_NAME}" in
          X64)
            arch=amd64
            sha256=f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
            ;;
          ARM64)
            arch=arm64
            sha256=15702c6e3a4a56a8bd8ac5c17efdbcab56d9bada661ccbcf017f5b10c1d89399
            ;;
          *)
            echo "::error::setup-oras: unsupported runner arch ${RUNNER_ARCH_NAME}" >&2
            exit 1
            ;;
        esac
        {
          echo "url=https://github.com/oras-project/oras/releases/download/v${version}/oras_${version}_linux_${arch}.tar.gz"
          echo "checksum=${sha256}"
        } >> "$GITHUB_OUTPUT"

    - name: Install ORAS
      uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      with:
        url: ${{ steps.asset.outputs.url }}
        checksum: ${{ steps.asset.outputs.checksum }}

    - name: Show ORAS version
      shell: bash
      run: oras version
