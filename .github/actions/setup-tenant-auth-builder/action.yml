name: Set up tenant-auth Rust image builder
description: Install the native Linux toolchains and libraries required by oci-builder
runs:
  using: composite
  steps:
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: '1.97.1'
        components: rustfmt, clippy

    - name: Set up Go for embedded Buildah
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.26.x'
        cache: false

    - name: Install native build and container prerequisites
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libseccomp-dev ca-certificates \
          uidmap crun netavark aardvark-dns
        # Avoid runner-specific rootless namespace/AppArmor restrictions.
        # The compiled builder runs as root and must trust the runner checkout.
        sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
