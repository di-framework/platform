# Build/push each architecture with Rust/embedded Buildah on a native runner.
# ORAS assembles the published manifests into one multi-architecture image index.
name: Publish tenant-auth image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-tenant-auth-image
  cancel-in-progress: false

jobs:
  publish-platform:
    name: Push tenant-auth (${{ matrix.arch }})
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Require di-framework/platform
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != di-framework/platform ]]; then
            echo '::error::Only di-framework/platform can publish this image'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up native image builder
        uses: ./.github/actions/setup-tenant-auth-builder

      - name: Compile the Rust builder
        run: cargo build -p tenant-auth-image --locked

      - name: Build, smoke-check, and push
        env:
          PUSH: 'true'
          SMOKE_CHECK: 'true'
          BUILDAH_ISOLATION: chroot
          DI_OCI_REGISTRY: ghcr.io
          DI_OCI_REPOSITORY: di-framework/tenant-auth
          DI_OCI_TAG: ${{ github.sha }}-${{ matrix.arch }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo --preserve-env=PUSH,SMOKE_CHECK,BUILDAH_ISOLATION,DI_OCI_REGISTRY,DI_OCI_REPOSITORY,DI_OCI_TAG,GHCR_USERNAME,GHCR_TOKEN \
            ./target/debug/tenant-auth-image

      - name: Upload platform publish report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tenant-auth-${{ matrix.arch }}
          path: platform/tenant-auth/dist/publish-report.json
          if-no-files-found: error

  publish-index:
    name: Publish multi-architecture tenant-auth index
    needs: publish-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install index verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq ca-certificates

      - name: Download platform publish reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: tenant-auth-*
          path: reports

      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: '1.3.4'

      - name: Assemble and verify image index
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          amd64="$(jq -er '.manifestDigest | select(test("^sha256:[0-9a-f]{64}$"))' reports/tenant-auth-amd64/publish-report.json)"
          arm64="$(jq -er '.manifestDigest | select(test("^sha256:[0-9a-f]{64}$"))' reports/tenant-auth-arm64/publish-report.json)"
          ref="ghcr.io/di-framework/tenant-auth:${GITHUB_SHA}"
          oras manifest index create "$ref" "$amd64" "$arm64"
          oras manifest fetch "$ref" > index.json
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' index.json
          digest="$(oras manifest fetch --descriptor "$ref" | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
          pinned="ghcr.io/di-framework/tenant-auth@${digest}"
          printf 'Published %s\n' "$pinned"
          {
            echo '### Tenant-auth image'
            echo
            printf '```\n%s\n```\n' "$pinned"
            echo
            echo 'Pin the controller and console Deployments to this digest. Both linux/amd64 and linux/arm64 are included.'
          } >> "$GITHUB_STEP_SUMMARY"
