# Build/push each architecture with Rust/embedded Buildah on a native runner.
# ORAS assembles the published manifests into one multi-architecture image index.
#
# Triggers (#172): a push to main that touches one of the paths below, and workflow_dispatch.
# check-source hashes the committed files in on.push.paths (scripts/source-check.ts); on a push
# the build is skipped when ghcr.io/di-framework/tenant-auth:src-<hash> already exists. A dispatch
# always builds. publish-index tags the index src-<hash>, and pin opens the bot PR
# "chore: pin tenant-auth to <digest>" (scripts/pin-artifact.ts).
#
# Permissions: workflow default contents: read. check-source reads packages. publish-platform
# builds and pushes each arch and publish-index pushes the index (packages: write). Only pin holds
# contents: write and pull-requests: write.
name: Publish tenant-auth image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'platform/tenant-auth/**'
      - 'platform/tenant-cli/**'
      - 'platform/oci-registry/**'
      - 'platform/wasm-component-publisher/**'
      - 'platform/pglite-component/build-support/**'
      - 'platform/sqlite-component/scripts/**'
      - 'platform/platform/src/tenancy/**'
      - 'package.json'
      - 'bun.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/actions/setup-tenant-auth-builder/**'
      - '.github/workflows/tenant-auth-image.yml'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: publish-tenant-auth-image
  cancel-in-progress: false

jobs:
  check-source:
    name: Check if source already published
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      source-hash: ${{ steps.check.outputs.hash }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up source check
        uses: ./.github/actions/setup-source-check
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if already published
        id: check
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # FORCE is empty or one flag
          bun scripts/source-check.ts --workflow .github/workflows/tenant-auth-image.yml \
            --image ghcr.io/di-framework/tenant-auth ${FORCE} >> "${GITHUB_OUTPUT}"

  publish-platform:
    name: Push tenant-auth (${{ matrix.arch }})
    needs: check-source
    if: ${{ !cancelled() && needs.check-source.result == 'success' && needs.check-source.outputs.skip != 'true' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Require di-framework/platform
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != di-framework/platform ]]; then
            echo '::error::Only di-framework/platform can publish this image'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up native image builder
        uses: ./.github/actions/setup-tenant-auth-builder

      - name: Compile the Rust builder
        run: cargo build -p tenant-auth-image --locked

      - name: Build, smoke-check, and push
        env:
          PUSH: 'true'
          SMOKE_CHECK: 'true'
          BUILDAH_ISOLATION: chroot
          DI_OCI_REGISTRY: ghcr.io
          DI_OCI_REPOSITORY: di-framework/tenant-auth
          DI_OCI_TAG: ${{ github.sha }}-${{ matrix.arch }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo --preserve-env=PUSH,SMOKE_CHECK,BUILDAH_ISOLATION,DI_OCI_REGISTRY,DI_OCI_REPOSITORY,DI_OCI_TAG,GHCR_USERNAME,GHCR_TOKEN \
            ./target/debug/tenant-auth-image

      - name: Upload platform publish report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tenant-auth-${{ matrix.arch }}
          path: platform/tenant-auth/dist/publish-report.json
          if-no-files-found: error

  publish-index:
    name: Publish multi-architecture tenant-auth index
    needs: [check-source, publish-platform]
    if: ${{ !cancelled() && needs.publish-platform.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - name: Install index verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq ca-certificates

      - name: Download platform publish reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: tenant-auth-*
          path: reports

      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: '1.3.4'

      - name: Assemble and verify image index
        id: index
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_HASH: ${{ needs.check-source.outputs.source-hash }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_HASH}" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::missing source hash'
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          amd64="$(jq -er '.manifestDigest | select(test("^sha256:[0-9a-f]{64}$"))' reports/tenant-auth-amd64/publish-report.json)"
          arm64="$(jq -er '.manifestDigest | select(test("^sha256:[0-9a-f]{64}$"))' reports/tenant-auth-arm64/publish-report.json)"
          ref="ghcr.io/di-framework/tenant-auth:${GITHUB_SHA}"
          oras manifest index create "$ref" "$amd64" "$arm64"
          oras manifest fetch "$ref" > index.json
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' index.json
          digest="$(oras manifest fetch --descriptor "$ref" | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
          pinned="ghcr.io/di-framework/tenant-auth@${digest}"
          oras tag "$pinned" "src-${SOURCE_HASH}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          printf 'Published %s (also tagged src-%s)\n' "$pinned" "$SOURCE_HASH"
          {
            echo '### Tenant-auth image'
            echo
            # shellcheck disable=SC2016 # the backticks are Markdown, not expansions
            printf '```\n%s\n```\n' "$pinned"
            echo
            echo 'Pin the controller and console Deployments to this digest. Both linux/amd64 and linux/arm64 are included.'
          } >> "$GITHUB_STEP_SUMMARY"

  pin:
    name: Open pin PR
    needs: publish-index
    if: ${{ !cancelled() && needs.publish-index.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open pin PR
        uses: ./.github/actions/open-pin-pr
        with:
          artifact: tenant-auth
          digest: ${{ needs.publish-index.outputs.digest }}
          token: ${{ secrets.GITHUB_TOKEN }}
