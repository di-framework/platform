name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install SQLite build toolchain
        run: |
          bash platform/sqlite-component/scripts/install-tools.sh --rust
          echo "$GITHUB_WORKSPACE/platform/sqlite-component/.tools/bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # @di-framework/pglite-component ships its wasm on npm. The release builds it
      # from source with the same make targets as ci.yml (engine via Docker) and runs
      # the smoke test against that exact build before the package is packed.
      - name: Install PGlite build toolchain
        run: |
          make -C platform/pglite-component tools-rust
          echo "$GITHUB_WORKSPACE/platform/pglite-component/.tools/bin" >> "$GITHUB_PATH"

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 'v48.0.1'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: |
          set -euo pipefail
          if node -e 'const p=require("./package.json"); process.exit(p.scripts && p.scripts.build ? 0 : 1)'; then
            bun run build
          fi

      - name: Build and smoke-test the PGlite component
        run: make -C platform/pglite-component unit smoke

      # `bun run build` does not compile @di-framework/sqlite-component or
      # @di-framework/pglite-component. This dry-run runs each package's build
      # (pglite: adapter + `make build`, reusing the engine built above) and refuses
      # a pack that omits a `files` entry, such as the pglite wasm or adapter. The
      # pack tests below read what that build leaves on disk, which is the same
      # order as the Test workflow.
      - name: Dry-run package publish
        run: bun scripts/publish-workspace.ts --dry-run

      - name: Test
        env:
          PGLITE_REQUIRE_DIST: '1'
        run: bun test --coverage

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure modern npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish packages to npm
        if: github.event_name != 'pull_request'
        run: bun scripts/publish-workspace.ts

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
            echo "Created GitHub Release $TAG"
          else
            echo "GitHub Release $TAG already exists"
          fi
