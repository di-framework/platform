name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: |
          set -euo pipefail
          if node -e 'const p=require("./package.json"); process.exit(p.scripts && p.scripts.build ? 0 : 1)'; then
            bun run build
          fi

      - name: Test
        run: bun test --coverage

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure modern npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish packages to npm
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cleanup() {
            git checkout -- $(git ls-files '*package.json') || true
          }
          trap cleanup EXIT
          # Publish every non-private workspace package. Skip a version already on npm.
          # package.json edits are restored by the trap, matching di-framework/di-framework.
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            private=$(node -p "require('./$pkg/package.json').private === true")
            if [ "$private" = "true" ]; then
              echo "Skipping $name (private)"
              continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version (already published)"
              continue
            fi
            if node -e 'const p=require(process.argv[1]); process.exit(p.scripts && p.scripts.build ? 0 : 1)' "$pkg/package.json"; then
              echo "Building $name from $pkg"
              (cd "$pkg" && bun run build)
            fi
            echo "Publishing $name@$version from $pkg"
            (cd "$pkg" && npm publish --access public --provenance --ignore-scripts)
          done < <(node --input-type=module <<'EOF'
          import { existsSync, readdirSync, readFileSync } from "node:fs";
          import { join } from "node:path";
          const root = JSON.parse(readFileSync("package.json", "utf8"));
          for (const pattern of root.workspaces ?? []) {
            const directories = pattern.endsWith("/*")
              ? readdirSync(pattern.slice(0, -2), { withFileTypes: true })
                  .filter((entry) => entry.isDirectory())
                  .map((entry) => join(pattern.slice(0, -2), entry.name))
              : [pattern];
            for (const directory of directories) {
              if (existsSync(join(directory, "package.json"))) console.log(directory);
            }
          }
          EOF
          )

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
            echo "Created GitHub Release $TAG"
          else
            echo "GitHub Release $TAG already exists"
          fi
