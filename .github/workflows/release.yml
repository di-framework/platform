name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Separate jobs, so the toolchains and Docker never run with publish credentials (#168):
#   build           builds and smoke-tests everything, packs every public package into a tarball
#                   once, and uploads the tarballs with their sha256 manifest. On a tag it also
#                   packs the Headlamp plugin and checks it against its Artifact Hub entry.
#                   No OIDC token.
#   publish         downloads those tarballs, checks them against the build job's digests, and
#                   runs `npm publish <tarball>`. Only this job holds id-token: write.
#   github-release  creates the GitHub Release for a tag and attaches the Headlamp plugin tarball
#                   the build job packed and checked against its Artifact Hub entry (#435), byte
#                   for byte. Only this job holds contents: write.
#   bake            after publish, pins the operator's baked install project to the version just
#                   published (scripts/operator-project.ts bump <version>: package.json, lockfile,
#                   plugins.txt) and uploads those three files (#431). No write permission.
#   operator-image  builds the operator image on each arch from the tag's source plus only that
#                   pin, pushes it by digest and checks it bakes the released version.
#   operator-index  joins the two into one index tagged v<version>; its digest is the release's.
#   chart           packages the operator Helm chart at the tag's version with image.digest set to
#                   operator-index's digest and pushes it to GHCR (#272). Chart N's image bakes
#                   @di-framework/platform N. operator-image, operator-index and chart are the
#                   only jobs with packages: write.
#   project-pr      opens bot/operator-project, a PR moving main's baked install project to the
#                   release (bake's files when main's project is still the tag's), so the next
#                   image from main embeds it too. Never moves the bot PR backwards, and closes one
#                   main has passed (#523). contents: write and pull-requests: write, nothing else.
# The pglite wasm npm receives is the one `make smoke` tested: it is not rebuilt after the smoke
# test, and both jobs compare its sha256 inside the packed tarball with the tested file's.
#
# One run per ref at a time (#485): a second run for the same tag queues behind the first instead
# of racing it on npm, GHCR and the GitHub Release, and its build job then stops at its first step
# if the first run already published. A run that failed before publishing can be dispatched again;
# one that failed after publishing is resumed with "Re-run failed jobs", which does not re-run build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.pack.outputs.manifest_sha256 }}
      pglite_wasm_sha256: ${{ steps.smoke.outputs.wasm_sha256 }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      plugin_sha256: ${{ steps.plugin.outputs.sha256 }}
    steps:
      # Only vX.Y.Z tags release (#523). The operator image bakes the version just published, and
      # scripts/operator-project.ts pins only X.Y.Z, so a prerelease tag would put its packages on
      # npm and then fail at bake with no image, chart or GitHub Release. Refuse it before publish.
      - name: Refuse a tag that is not a release version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z; prerelease and other tags are not released (nothing was published)"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is a release tag"

      # A backstop against a second Release run for a tag (#485); Auto Tag dispatches once per tag.
      # A run that failed before publishing left neither behind, so it passes. npm can take a few
      # minutes to show a new version, so this does not replace the concurrency group above.
      - name: Refuse a version that is already released
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::GitHub Release v$VERSION already exists; not releasing it again. Use Re-run failed jobs on the original run instead."
            exit 1
          fi
          if PUBLISHED="$(npm view "@di-framework/platform@$VERSION" version 2>"$RUNNER_TEMP/npm-view.err")"; then
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "::error::@di-framework/platform@$VERSION is already on npm; not releasing it again. Use Re-run failed jobs on the original run instead."
              exit 1
            fi
          elif ! grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
            cat "$RUNNER_TEMP/npm-view.err" >&2
            echo "::warning::could not check npm for @di-framework/platform@$VERSION; continuing (the publish step skips versions already on npm)"
          fi
          echo "v$VERSION is not released yet"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install SQLite build toolchain
        run: |
          bash platform/sqlite-component/scripts/install-tools.sh --rust
          echo "$GITHUB_WORKSPACE/platform/sqlite-component/.tools/bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'

      # @di-framework/pglite-component ships its wasm on npm. The release builds it
      # from source with the same make targets as ci.yml (engine via Docker) and runs
      # the smoke test against that exact build before the package is packed.
      - name: Install PGlite build toolchain
        run: |
          make -C platform/pglite-component tools-rust
          echo "$GITHUB_WORKSPACE/platform/pglite-component/.tools/bin" >> "$GITHUB_PATH"

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: 'v48.0.1'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: |
          set -euo pipefail
          if node -e 'const p=require("./package.json"); process.exit(p.scripts && p.scripts.build ? 0 : 1)'; then
            bun run build
          fi

      # The sha256 recorded here is the wasm that passed the smoke test. Nothing below
      # rebuilds it, and the pack is checked against it.
      - name: Build and smoke-test the PGlite component
        id: smoke
        run: |
          set -euo pipefail
          make -C platform/pglite-component unit smoke
          sum="$(sha256sum platform/pglite-component/dist/di-framework-pglite.wasm | cut -d' ' -f1)"
          echo "wasm_sha256=${sum}" >> "$GITHUB_OUTPUT"
          echo "Smoke-tested di-framework-pglite.wasm sha256:${sum}"

      # `npm pack` below is the packer `npm publish` used before #168.
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # `bun run build` does not compile @di-framework/sqlite-component or
      # @di-framework/pglite-component. The pack step runs each package's build, `npm pack`s
      # it once and refuses a tarball that omits a `files` entry, such as the pglite wasm or
      # adapter. pglite is --prebuilt: only its adapter is compiled here, so the packed wasm is
      # the file `make smoke` tested, not a rebuild. The pack tests below read what these
      # builds leave on disk, which is the same order as the Test workflow.
      - name: Build the PGlite adapter
        run: bun run --cwd platform/pglite-component build:adapter

      - name: Pack packages
        run: |
          bun scripts/publish-workspace.ts --pack "$RUNNER_TEMP/npm-packages" \
            --prebuilt @di-framework/pglite-component

      - name: Check the packed PGlite wasm is the smoke-tested one
        env:
          EXPECTED_SHA256: ${{ steps.smoke.outputs.wasm_sha256 }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/npm-packages"
          tarball="$(jq -er '.[] | select(.name == "@di-framework/pglite-component") | .filename' "$dir/packages.json")"
          actual="$(tar -xzOf "$dir/$tarball" package/dist/di-framework-pglite.wasm | sha256sum | cut -d' ' -f1)"
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ || "$actual" != "$EXPECTED_SHA256" ]]; then
            echo "::error::packed wasm ($actual) differs from the smoke-tested build ($EXPECTED_SHA256)"
            exit 1
          fi
          echo "Packed di-framework-pglite.wasm matches the smoke-tested build (sha256:$actual)"

      - name: Test
        env:
          PGLITE_REQUIRE_DIST: '1'
        run: bun test --coverage

      # Re-checks every tarball against packages.json after the tests, then hands the
      # manifest's sha256 to the publish job.
      - name: Record package digests
        id: pack
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/npm-packages"
          bun scripts/publish-workspace.ts --verify-packed "$dir"
          sum="$(sha256sum "$dir/packages.json" | cut -d' ' -f1)"
          echo "manifest_sha256=${sum}" >> "$GITHUB_OUTPUT"
          echo "packages.json sha256:${sum}"

      - name: Upload packed packages
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages/
          if-no-files-found: error
          retention-days: 7

      # The Headlamp plugin tarball its Artifact Hub entry points at (#435). The release PR packed it
      # and recorded the sha256 in platform/operator/headlamp-plugin/artifacthub/<version>/; packing
      # again at the tag must give the same bytes. github-release uploads this artifact as is.
      # The same Node as the plugin's CI job: the tarball's gzip bytes come from Node's zlib.
      - name: Setup Node for the Headlamp plugin
        if: github.ref_type == 'tag'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'

      - name: Pack the Headlamp plugin and check it against its Artifact Hub entry
        id: plugin
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ENTRY="platform/operator/headlamp-plugin/artifacthub/$VERSION/artifacthub-pkg.yml"
          if [ ! -f "$ENTRY" ]; then
            echo "::error::$ENTRY is missing at $GITHUB_REF_NAME: the release PR writes it; not releasing the Headlamp plugin"
            exit 1
          fi
          # The recorded sha256 depends on Node's zlib: refuse any Node but the pinned one.
          if [ "$(node -v)" != "v22.23.2" ]; then
            echo "::error::the Headlamp plugin must be packed with Node v22.23.2, not $(node -v)"
            exit 1
          fi
          bun install --cwd platform/operator/headlamp-plugin --frozen-lockfile --ignore-scripts
          bun run --cwd platform/operator/headlamp-plugin package
          if ! bun scripts/artifacthub-plugin.ts verify "$VERSION" --required; then
            echo "::error::the Headlamp plugin packed at $GITHUB_REF_NAME does not match its Artifact Hub entry; not releasing it"
            exit 1
          fi
          TARBALL="platform/operator/headlamp-plugin/dist-package/di-framework-platform-$VERSION.tar.gz"
          echo "sha256=$(sha256sum "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the Headlamp plugin
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headlamp-plugin
          path: |
            platform/operator/headlamp-plugin/dist-package/*.tar.gz
            platform/operator/headlamp-plugin/dist-package/*.sha256
          if-no-files-found: error
          retention-days: 7

  # Runs no build: it publishes the tarballs the build job tested, byte for byte.
  publish:
    name: Publish packages to npm
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure modern npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Download packed packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages

      # packages.json must be the one the build job wrote, and the pglite tarball must still
      # carry the smoke-tested wasm. The publish step then checks every tarball against
      # packages.json before it publishes anything.
      - name: Verify the downloaded packages are the tested build
        env:
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          WASM_SHA256: ${{ needs.build.outputs.pglite_wasm_sha256 }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/npm-packages"
          echo "Artifact npm-packages digest: ${ARTIFACT_DIGEST}"
          actual="$(sha256sum "$dir/packages.json" | cut -d' ' -f1)"
          if [[ ! "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ || "$actual" != "$MANIFEST_SHA256" ]]; then
            echo "::error::downloaded packages.json ($actual) differs from the build job's ($MANIFEST_SHA256)"
            exit 1
          fi
          tarball="$(jq -er '.[] | select(.name == "@di-framework/pglite-component") | .filename' "$dir/packages.json")"
          wasm="$(tar -xzOf "$dir/$tarball" package/dist/di-framework-pglite.wasm | sha256sum | cut -d' ' -f1)"
          if [[ ! "$WASM_SHA256" =~ ^[0-9a-f]{64}$ || "$wasm" != "$WASM_SHA256" ]]; then
            echo "::error::packed wasm ($wasm) differs from the smoke-tested build ($WASM_SHA256)"
            exit 1
          fi
          echo "packages.json sha256:${actual}; pglite wasm sha256:${wasm}"

      - name: Publish packages to npm
        run: bun scripts/publish-workspace.ts --publish-packed "$RUNNER_TEMP/npm-packages"

  # The operator image bakes one install project, its default platform version (#431). Release N's
  # image bakes @di-framework/platform N, which only exists once publish has put it on npm, so the
  # pin moves here and not in the release PR. The bump is the only change to the tag's source:
  # operator-image refuses any other. Only tags: a dispatch on a branch has no release version.
  bake:
    name: Pin the operator's baked platform to the release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      project_sha256: ${{ steps.bump.outputs.project_sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'

      # The bump relocks with `npm install --package-lock-only`.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      # npm can take a few minutes to serve a version it has just published, so the bump is retried
      # (prefer-online: no cached packument). Exactly the released version: never npm's `latest`.
      # Only exit 75 is retried (#523): npm does not serve the version yet, or the registry failed
      # in a way a retry can fix. A refusal (exit 2) or any other failure stops at once.
      - name: Pin the baked install project to the released version
        id: bump
        env:
          NPM_CONFIG_PREFER_ONLINE: 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT=platform/operator/internal/installer/project
          for attempt in $(seq 1 20); do
            code=0
            bun scripts/operator-project.ts bump "$VERSION" || code=$?
            if [ "$code" = 0 ]; then
              break
            fi
            if [ "$code" != 75 ]; then
              echo "::error::could not pin the operator's baked install project to @di-framework/platform@$VERSION (exit $code; not retried)"
              exit 1
            fi
            if [ "$attempt" = 20 ]; then
              echo "::error::could not pin the operator's baked install project to @di-framework/platform@$VERSION"
              exit 1
            fi
            echo "attempt $attempt failed; npm may not serve $VERSION yet, retrying in 30s"
            sleep 30
          done
          pinned="$(jq -er '.dependencies["@di-framework/platform"]' "$PROJECT/package.json")"
          locked="$(jq -er '.packages["node_modules/@di-framework/platform"].version' "$PROJECT/package-lock.json")"
          if [ "$pinned" != "$VERSION" ] || [ "$locked" != "$VERSION" ]; then
            echo "::error::the baked install project pins $pinned and locks $locked, not the release $VERSION"
            exit 1
          fi
          changed="$(git status --porcelain --untracked-files=all | grep -v " $PROJECT/" || true)"
          if [ -n "$changed" ]; then
            echo "::error::the bump changed files outside $PROJECT:"
            echo "$changed"
            exit 1
          fi
          sum="$(cd "$PROJECT" && sha256sum package.json package-lock.json plugins.txt | sha256sum | cut -d' ' -f1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "project_sha256=$sum" >> "$GITHUB_OUTPUT"
          git diff --stat
          echo "Baked install project pinned to @di-framework/platform@$VERSION (files sha256:$sum)"

      - name: Upload the baked install project
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operator-project
          path: |
            platform/operator/internal/installer/project/package.json
            platform/operator/internal/installer/project/package-lock.json
            platform/operator/internal/installer/project/plugins.txt
          if-no-files-found: error
          retention-days: 7

  # The tag's source plus bake's three files, on native amd64 and arm64 runners like
  # platform-operator-image.yml. The binary is compiled in the same build from the same
  # package.json, so it embeds the version the image bakes. Pushed by digest only: the per-arch
  # images get no tag, and the registry cache is read but never written, so this never moves a tag
  # the main-branch image workflow uses (<sha>, src-<hash>, buildcache-*).
  operator-image:
    name: Build the release operator image on ${{ matrix.platform }}
    needs: bake
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Require di-framework/platform
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "di-framework/platform" ]]; then
            echo "::error::This job publishes ghcr.io/di-framework/platform-operator and only runs in di-framework/platform"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the baked install project
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: operator-project
          path: ${{ runner.temp }}/operator-project

      # The build context is the tag's source with only the three pinned files replaced.
      - name: Apply the release pin
        env:
          VERSION: ${{ needs.bake.outputs.version }}
          PROJECT_SHA256: ${{ needs.bake.outputs.project_sha256 }}
        run: |
          set -euo pipefail
          PROJECT=platform/operator/internal/installer/project
          if [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::bake pinned $VERSION, not the release ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          for f in package.json package-lock.json plugins.txt; do
            cp "$RUNNER_TEMP/operator-project/$f" "$PROJECT/$f"
          done
          sum="$(cd "$PROJECT" && sha256sum package.json package-lock.json plugins.txt | sha256sum | cut -d' ' -f1)"
          if [[ ! "$PROJECT_SHA256" =~ ^[0-9a-f]{64}$ || "$sum" != "$PROJECT_SHA256" ]]; then
            echo "::error::downloaded install project ($sum) differs from the one bake pinned ($PROJECT_SHA256)"
            exit 1
          fi
          changed="$(git status --porcelain --untracked-files=all | grep -v " $PROJECT/" || true)"
          if [ -n "$changed" ]; then
            echo "::error::the build context differs from $GITHUB_REF_NAME outside $PROJECT:"
            echo "$changed"
            exit 1
          fi
          git diff --stat

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The revision is the tag's commit, but the three project files differ from it: the
      # project-sha256 label ties the image to bake's files (#523). Recompute it from the files with
      # `(cd platform/operator/internal/installer/project && sha256sum package.json
      # package-lock.json plugins.txt | sha256sum)`.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: platform/operator
          platforms: ${{ matrix.platform }}
          provenance: true
          labels: |
            org.opencontainers.image.source=https://github.com/di-framework/platform
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.bake.outputs.version }}
            org.opencontainers.image.description=di-framework platform operator (PlatformInstance controller)
            dev.di-framework.platform-operator.project-sha256=${{ needs.bake.outputs.project_sha256 }}
          outputs: type=image,name=ghcr.io/di-framework/platform-operator,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/di-framework/platform-operator:buildcache-${{ matrix.arch }}

      # Runs the pushed image on this runner's arch: it must bake the released platform, its binary
      # must default to it (--print-default-version, #523), and it must carry bake's project-sha256.
      - name: Check the image bakes the release
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.bake.outputs.version }}
          PROJECT_SHA256: ${{ needs.bake.outputs.project_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build did not return a digest"
            exit 1
          fi
          image="ghcr.io/di-framework/platform-operator@${DIGEST}"
          baked="$(docker run --rm --pull always --entrypoint node "$image" -p \
            "require('/opt/platform-operator/project/node_modules/@di-framework/platform/package.json').version")"
          if [ "$baked" != "$VERSION" ]; then
            echo "::error::$image bakes @di-framework/platform@$baked, not the release $VERSION"
            exit 1
          fi
          docker run --rm --entrypoint cat "$image" /opt/platform-operator/project/package.json \
            > "$RUNNER_TEMP/baked-package.json"
          if ! cmp "$RUNNER_TEMP/baked-package.json" platform/operator/internal/installer/project/package.json; then
            echo "::error::$image bakes a package.json other than the one its binary was built with"
            exit 1
          fi
          # The version compiled into the binary, not only the package.json beside it.
          compiled="$(docker run --rm "$image" --print-default-version)"
          if [ "$compiled" != "$VERSION" ]; then
            echo "::error::$image's platform-operator defaults to @di-framework/platform@$compiled, not the release $VERSION"
            exit 1
          fi
          label="$(docker image inspect --format '{{ index .Config.Labels "dev.di-framework.platform-operator.project-sha256" }}' "$image")"
          if [[ ! "$PROJECT_SHA256" =~ ^[0-9a-f]{64}$ || "$label" != "$PROJECT_SHA256" ]]; then
            echo "::error::$image is labelled project-sha256=$label, not bake's $PROJECT_SHA256"
            exit 1
          fi
          echo "$image bakes @di-framework/platform@$baked, its binary defaults to $compiled, project-sha256=$label"
          mkdir -p "${RUNNER_TEMP}/digests"
          : > "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operator-release-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 7

  # One multi-arch index for the release, tagged v<version> (a tag the main-branch workflow never
  # writes). Its digest is what chart N pins.
  operator-index:
    name: Publish the release operator index
    needs: [bake, operator-image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: operator-release-digest-amd64
          path: ${{ runner.temp }}/digests

      - name: Download arm64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: operator-release-digest-arm64
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the index
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.bake.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f | sort)
          if (( ${#files[@]} != 2 )); then
            echo "::error::expected 2 image digests, found ${#files[@]}"
            exit 1
          fi
          args=()
          for file in "${files[@]}"; do
            hex="$(basename "${file}")"
            if [[ ! "${hex}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::unexpected digest file ${hex}"
              exit 1
            fi
            args+=("ghcr.io/di-framework/platform-operator@sha256:${hex}")
          done
          docker buildx imagetools create \
            --metadata-file "${RUNNER_TEMP}/operator-index.json" \
            --tag "ghcr.io/di-framework/platform-operator:v${VERSION}" \
            "${args[@]}"
          digest="$(jq -er '.["containerimage.descriptor"].digest' "${RUNNER_TEMP}/operator-index.json")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::manifest list did not return an index digest"
            exit 1
          fi
          pinned="ghcr.io/di-framework/platform-operator@${digest}"
          docker buildx imagetools inspect --raw "${pinned}" > "${RUNNER_TEMP}/index.json"
          jq -e '[.manifests[] | select(.platform.os != "unknown") | .platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' "${RUNNER_TEMP}/index.json"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo '### Release operator image'
            echo
            # shellcheck disable=SC2016 # the backticks are Markdown, not expansions
            printf '```\n%s\n```\n' "${pinned}"
            echo
            echo "Tagged \`v${VERSION}\`; bakes @di-framework/platform@${VERSION}. Both linux/amd64 and linux/arm64 are included."
          } >> "${GITHUB_STEP_SUMMARY}"

  # The platform operator's Helm chart (#272), at the release's version, pushed as an OCI chart to
  # ghcr.io/di-framework/charts/platform-operator. Only tags: a dispatch on a branch has no
  # release version. It packages the chart as checked in (Headlamp is vendored in charts/), with
  # image.digest set to the release image operator-index pushed, so chart N runs an operator that
  # bakes @di-framework/platform N. It builds and fetches nothing else.
  chart:
    name: Publish the operator Helm chart
    needs: [build, operator-index]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same helm as the chart tests (platform/backup-destination/tests/support/helm.ts).
      - name: Install helm
        env:
          HELM_VERSION: '3.18.4'
          HELM_SHA256: f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1
        run: |
          set -euo pipefail
          archive="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$archive" "https://get.helm.sh/$archive"
          echo "${HELM_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/helm" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"

      # The chart pins the release's own image, not main's latest image from values.yaml: that one
      # bakes an older platform (#431).
      - name: Pin the release operator image
        id: pin
        env:
          DIGEST: ${{ needs.operator-index.outputs.digest }}
        run: |
          set -euo pipefail
          VALUES=platform/operator/chart/values.yaml
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::operator-index returned no image digest (${DIGEST}); not publishing the chart"
            exit 1
          fi
          if [ "$(grep -c '^  digest: ' "$VALUES")" != 1 ]; then
            echo "::error::$VALUES must have exactly one image digest line"
            exit 1
          fi
          sed "s/^  digest: .*$/  digest: ${DIGEST}/" "$VALUES" > "$RUNNER_TEMP/values.yaml"
          mv "$RUNNER_TEMP/values.yaml" "$VALUES"
          if [ "$(sed -n 's/^  digest: *//p' "$VALUES")" != "$DIGEST" ]; then
            echo "::error::could not pin $VALUES to ${DIGEST}"
            exit 1
          fi
          echo "The chart pins ghcr.io/di-framework/platform-operator@${DIGEST}"

      # The release version is the tag without its `v`, and must be the version package.json
      # carries at that tag.
      - name: Package the chart
        id: package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not vX.Y.Z"
            exit 1
          fi
          PACKAGE_VERSION="$(jq -er .version package.json)"
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}"
            exit 1
          fi
          helm lint platform/operator/chart
          # The digest is pinned; the packaged defaults must also render. existingSecret only skips
          # the passphrase's offline-render guard.
          if ! helm template platform-operator platform/operator/chart \
            --set passphrase.existingSecret=release-check >/dev/null; then
            echo "::error::platform/operator/chart does not render with its default values; refusing to publish the chart"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/chart"
          helm package platform/operator/chart --version "$VERSION" --app-version "$VERSION" \
            --destination "$RUNNER_TEMP/chart"
          echo "tarball=$RUNNER_TEMP/chart/platform-operator-${VERSION}.tgz" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # helm 3 packaging is not reproducible and helm push overwrites a tag, so a re-run would
      # replace a released chart with different bytes. Push only when the version is not there yet.
      - name: Push the chart to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if helm show chart oci://ghcr.io/di-framework/charts/platform-operator --version "$VERSION" \
            >/dev/null 2>"$RUNNER_TEMP/show-chart.err"; then
            echo "::notice::platform-operator ${VERSION} is already in ghcr.io/di-framework/charts; not pushing it again"
          # A missing tag is "not found"/"manifest unknown"; a package that does not exist yet (the
          # first release) is "name unknown" or a 403 "denied". A real auth problem fails the push.
          elif grep -qiE 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/show-chart.err"; then
            helm push "$TARBALL" oci://ghcr.io/di-framework/charts
          elif grep -qi 'denied' "$RUNNER_TEMP/show-chart.err"; then
            echo "::warning::GHCR denied reading platform-operator ${VERSION}; treating this as the chart's first publish. If the push fails, the package's Manage Actions access is missing this repository."
            helm push "$TARBALL" oci://ghcr.io/di-framework/charts
          else
            cat "$RUNNER_TEMP/show-chart.err" >&2
            echo "::error::could not check whether platform-operator ${VERSION} is already published"
            exit 1
          fi
          helm registry logout ghcr.io

  github-release:
    name: Create GitHub Release
    needs: [build, publish, chart]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
            echo "Created GitHub Release $TAG"
          else
            echo "GitHub Release $TAG already exists"
          fi

      # The Headlamp plugin the build job packed and checked against its Artifact Hub entry (#435),
      # uploaded byte for byte: nothing is rebuilt here.
      - name: Download the Headlamp plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headlamp-plugin
          path: ${{ runner.temp }}/headlamp-plugin

      - name: Upload the Headlamp plugin to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA256: ${{ needs.build.outputs.plugin_sha256 }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TARBALL="$RUNNER_TEMP/headlamp-plugin/di-framework-platform-${TAG#v}.tar.gz"
          actual="$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ || "$actual" != "$EXPECTED_SHA256" ]]; then
            echo "::error::downloaded Headlamp plugin ($actual) differs from the one the build job checked ($EXPECTED_SHA256)"
            exit 1
          fi
          # Never replace released bytes: each asset is uploaded only if the release lacks it.
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for FILE in "$TARBALL" "$TARBALL.sha256"; do
            NAME="$(basename "$FILE")"
            if grep -Fxq "$NAME" <<< "$ASSETS"; then
              echo "$NAME is already on $TAG; not uploading it again"
            else
              gh release upload "$TAG" "$FILE"
              echo "Uploaded $NAME to $TAG"
            fi
          done

  # Moves main's baked install project to the release, so the next operator image built from main
  # (platform-operator-image.yml) embeds and bakes it too. The PR is bot/operator-project; it is
  # opened with GITHUB_TOKEN, so a maintainer starts its CI and merges it, and that merge (a push to
  # main changing an image input) publishes the next main image and its pin PR.
  # When main's three project files are still the tag's, the PR commits bake's three files as they
  # are, so main's next image installs exactly what the vN image does (#523). Otherwise (a template
  # change made on main since the tag) main is bumped on its own package.json, which keeps it.
  # It never moves backwards (#523): a main that already pins this release or a newer one gets no
  # PR, and an open bot PR that main has passed is closed; an open bot PR that moves main to a newer
  # release than this one is left alone (two tags close together, or "Re-run failed jobs" on an
  # older release). The push is leased on the branch as read, so a newer release's project-pr that
  # pushes in between is never overwritten.
  project-pr:
    name: Open the baked platform PR for main
    needs: [bake, chart]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Download the baked install project
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: operator-project
          path: ${{ runner.temp }}/operator-project

      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_PREFER_ONLINE: 'true'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROJECT_SHA256: ${{ needs.bake.outputs.project_sha256 }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT=platform/operator/internal/installer/project
          BAKED="${RUNNER_TEMP}/operator-project"
          FILES=(package.json package-lock.json plugins.txt)
          branch=bot/operator-project
          pin() { jq -er '.dependencies["@di-framework/platform"]' "$1"; }
          # newer A B: A is a later release than B.
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }
          # The open bot PR (existing), the branch's commit (lease; empty when there is no branch), the
          # release the branch moves main to (branch_pin), and that release only while a PR is open
          # (bot_pin).
          read_bot() {
            existing="$(BRANCH="${branch}" gh pr list --head "${branch}" --base main --state open \
              --json number,author,headRefName \
              --jq 'map(select(.author.login == "app/github-actions" and .headRefName == env.BRANCH)) | .[0].number // empty')"
            lease=''
            branch_pin=''
            bot_pin=''
            if git fetch --quiet --depth=1 origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" 2>/dev/null; then
              lease="$(git rev-parse "refs/remotes/origin/${branch}")"
              branch_pin="$(git show "refs/remotes/origin/${branch}:${PROJECT}/package.json" | pin /dev/stdin)"
              if [[ -n "${existing}" ]]; then bot_pin="${branch_pin}"; fi
            fi
          }
          read_bot
          current="$(pin "$PROJECT/package.json")"
          if ! newer "$VERSION" "$current"; then
            echo "::notice::main already bakes @di-framework/platform@$current; no PR for $VERSION"
            if [[ -n "${existing}" && -n "${bot_pin}" ]] && ! newer "$bot_pin" "$current"; then
              gh pr close "${existing}" --delete-branch \
                --comment "Superseded: main already bakes \`@di-framework/platform@${current}\` (${GITHUB_REF_NAME}, [run](${RUN_URL}))."
              echo "Closed PR #${existing} (bakes ${bot_pin}): main is already at ${current}"
            fi
            exit 0
          fi
          if [[ -n "${bot_pin}" ]] && newer "$bot_pin" "$VERSION"; then
            echo "::notice::PR #${existing} already moves main to @di-framework/platform@$bot_pin, newer than $VERSION; leaving it"
            exit 0
          fi
          # bake's files, as the vN image was built with them, when main's project is still the tag's
          # (bake changed only the pin and what follows from it); otherwise main's own, bumped.
          sum="$(cd "$BAKED" && sha256sum "${FILES[@]}" | sha256sum | cut -d' ' -f1)"
          if [[ ! "$PROJECT_SHA256" =~ ^[0-9a-f]{64}$ || "$sum" != "$PROJECT_SHA256" ]]; then
            echo "::error::downloaded install project ($sum) differs from the one bake pinned ($PROJECT_SHA256)"
            exit 1
          fi
          git fetch --quiet --depth=1 origin "$GITHUB_SHA"
          if git diff --quiet "$GITHUB_SHA" HEAD -- "$PROJECT"; then
            for f in "${FILES[@]}"; do cp "$BAKED/$f" "$PROJECT/$f"; done
            source="the files the ${GITHUB_REF_NAME} operator image was built with, unchanged (project-sha256 \`${PROJECT_SHA256}\`)"
          else
            echo "::notice::main's $PROJECT differs from ${GITHUB_REF_NAME}'s; bumping main's own"
            bun scripts/operator-project.ts bump "$VERSION"
            source="\`bun scripts/operator-project.ts bump ${VERSION}\` on main, whose project differs from ${GITHUB_REF_NAME}'s"
          fi
          if git diff --quiet; then
            echo "::notice::main's baked install project is already at $VERSION"
            exit 0
          fi
          changed="$(git status --porcelain --untracked-files=all | grep -v " $PROJECT/" || true)"
          if [ -n "$changed" ]; then
            echo "::error::the PR would change files outside $PROJECT:"
            echo "$changed"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          title="chore(operator): bake @di-framework/platform ${VERSION}"
          git switch -C "$branch"
          git add "$PROJECT"
          git commit -m "$title"
          # Leased on the branch as read above (absent: it must still be absent).
          if ! git push --force-with-lease="refs/heads/${branch}:${lease}" origin "HEAD:refs/heads/${branch}"; then
            read_bot
            if [[ -n "${branch_pin}" ]] && ! newer "$VERSION" "$branch_pin"; then
              echo "::notice::${branch} moved to @di-framework/platform@$branch_pin during this run; leaving it"
              exit 0
            fi
            echo "::error::could not push ${branch}"
            exit 1
          fi
          body="${RUNNER_TEMP}/operator-project-pr.md"
          # shellcheck disable=SC2016 # the backticks are Markdown, not expansions
          {
            echo "Release ${GITHUB_REF_NAME} published \`@di-framework/platform@${VERSION}\`, and its chart runs an operator image that bakes it ([run](${RUN_URL}))."
            echo "This moves main's baked install project (\`${PROJECT}\`) to ${VERSION}, so the next operator image built from main embeds and bakes it too (#431). The files are ${source}."
            echo
            git diff --stat HEAD~1 HEAD
            echo
            echo '**A maintainer has to approve and run this PR'"'"'s workflows before it can merge.**'
            echo 'It was opened with `GITHUB_TOKEN`, and GitHub does not trigger workflows for pull requests'
            echo 'that `GITHUB_TOKEN` creates or updates, so no checks start on their own. Close and reopen'
            echo 'the PR (or push a commit to the branch) to run CI. Merging it publishes the next operator'
            echo 'image from main, and that opens its pin PR.'
          } > "${body}"
          if [[ -n "${existing}" ]]; then
            gh pr edit "${existing}" --title "${title}" --body-file "${body}"
            echo "Updated PR #${existing}"
          else
            gh pr create --base main --head "${branch}" --title "${title}" --body-file "${body}"
          fi
