name: Auto Tag

# Two jobs, so no run waits for the release PR to merge (#214):
#   tag         tags the merge commit of a release PR and dispatches release.yml. It runs when a
#               release/v* PR is merged, on a schedule (every 30 minutes) to tag releases merged
#               by GITHUB_TOKEN (which fire no push or pull_request events), and before release-pr
#               in every other run. Idempotent: when the tag already exists at the release commit
#               it only dispatches release.yml again if no Release run exists for the tag. Tag jobs
#               of all runs share one concurrency group, so they run one at a time (#485). A
#               scheduled run when nothing needs tagging exits quietly (action=none). Schedules
#               run only from the default branch; if disabled by GitHub (after 60 days of
#               inactivity), re-enable the workflow first, then dispatch with `tag_only: true`.
#   release-pr  bumps the version, updates bun.lock, opens the release PR and enables
#               auto-merge, then exits. Never runs on schedule or on a tag_only dispatch.
#
# What publishes a release: merging the release PR. Release PRs opened and auto-merged with
# GITHUB_TOKEN fire no `push` or `pull_request` events, so the scheduled tag job catches them
# within about 30 minutes. The tag job then tags the commit and dispatches release.yml (which
# reads the tag and publishes). Use `tag_only: true` to tag and release sooner.
#
# Recovery: dispatch this workflow with `tag_only: true`. It runs only the tag job: it tags the
# version on main if needed and dispatches release.yml if no Release run exists for the tag. It
# never opens a new release PR. If the schedule has been disabled by GitHub (after 60 days of
# inactivity), re-enable it first via the Actions tab or `gh workflow enable auto-tag.yml`, then dispatch.
#
# A tag pushed with GITHUB_TOKEN does not fire release.yml's `push: tags` trigger, so the tag
# job dispatches release.yml with `gh workflow run --ref v<version>` (workflow_dispatch is the
# exception to the GITHUB_TOKEN rule). release.yml then runs on the tag ref.

on:
  push:
    branches: [main]
    paths:
      - 'bun.lock'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which component to bump'
        type: choice
        options: [patch, minor, major]
        default: patch
      tag_only:
        description: 'Recovery: only tag the version on main and dispatch Release if it never ran; open no release PR'
        type: boolean
        default: false
  schedule:
    - cron: '*/30 * * * *'

permissions: {}

jobs:
  tag:
    name: Tag the merged release
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.repository == 'di-framework/platform') ||
      (github.event_name != 'pull_request' &&
      github.event_name != 'schedule') ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    # One group for the tag jobs of every run (#485). Merging a release PR fires a push run and a
    # pull_request run in the same second; run concurrently, both tagged, the two tag objects were
    # byte-identical (same message, commit and tagger second), so the second push succeeded as a
    # no-op and both dispatched Release. Serialized, the second finds the tag and the Release run
    # and does nothing. Not the release-pr job's `auto-tag` group (nor a workflow-level one): a
    # run would then wait on itself. GitHub keeps one pending job per group and cancels the older
    # pending one, which drops a pending push run's release-pr only when a third tag job queues
    # behind it. A release merge's push run opens no release PR, so nothing is lost there; any
    # other lost bump is recovered by dispatching this workflow.
    concurrency:
      group: auto-tag-tag
      cancel-in-progress: false
    permissions:
      contents: write # push the tag
      actions: write # list Release runs, dispatch release.yml
      pull-requests: read # find the PR a release commit was merged from
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Find the release commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin main

          version_at() {
            git show "$1:package.json" | jq -r '.version // ""'
          }
          none() {
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT" = "pull_request" ]; then
            VERSION="${HEAD_REF#release/v}"
            COMMIT="$MERGE_SHA"
            if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
              echo "::error::merge commit $COMMIT of $HEAD_REF is not on main"
              exit 1
            fi
            AT=$(version_at "$COMMIT")
            if [ "$AT" != "$VERSION" ]; then
              echo "::error::$HEAD_REF merged as $COMMIT, but its package.json version is '$AT'"
              exit 1
            fi
          else
            VERSION=$(version_at origin/main)
            if [ -z "$VERSION" ]; then
              echo "::error::could not read version from package.json on main"
              exit 1
            fi
            # The newest first-parent commit on main whose subject is this version's release
            # commit. Squash merges append " (#N)".
            LOG=$(git log origin/main --first-parent --format='%H%x09%s')
            COMMIT=$(printf '%s\n' "$LOG" | awk -F '\t' -v want="chore(release): v$VERSION" \
              '!found && ($2 == want || index($2, want " ") == 1) { print $1; found = 1 }')
            if [ -z "$COMMIT" ]; then
              echo "v$VERSION on main did not come from a release commit; nothing to tag."
              none
            fi
            # The same guards as the pull_request path: the commit sets version X and is the
            # merge of a same-repository release/vX PR.
            AT=$(version_at "$COMMIT")
            if [ "$AT" != "$VERSION" ]; then
              echo "::warning::$COMMIT is titled v$VERSION, but its package.json version is '$AT'; not tagging."
              none
            fi
            PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" |
              jq -r --arg ref "release/v$VERSION" --arg repo "$GITHUB_REPOSITORY" \
                '[.[] | select(.merged_at != null and .head.ref == $ref and .head.repo.full_name == $repo)][0].number // empty')
            if [ -z "$PR" ]; then
              echo "::warning::$COMMIT is not the merge of a release/v$VERSION PR from $GITHUB_REPOSITORY; not tagging."
              none
            fi
            echo "Release commit $COMMIT is the merge of PR #$PR"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            TAGGED=$(git rev-parse "v$VERSION^{commit}")
            if [ "$TAGGED" != "$COMMIT" ]; then
              echo "::warning::tag v$VERSION already exists at $TAGGED, not at release commit $COMMIT; not dispatching."
              none
            fi
            # A dispatch that failed after the tag push is retried here. A Release run that
            # exists but failed is not: re-run it from the Actions tab.
            RUNS=$(gh run list --workflow release.yml --branch "v$VERSION" --limit 1 --json databaseId | jq length)
            if [ "$RUNS" != "0" ]; then
              echo "Tag v$VERSION exists and Release has run for it; nothing to do."
              none
            fi
            echo "::notice::tag v$VERSION exists but no Release run does; dispatching Release."
            echo "action=dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "action=tag" >> "$GITHUB_OUTPUT"
          echo "Release v$VERSION is $COMMIT"

      - name: Tag the release commit and dispatch Release
        if: steps.release.outputs.action == 'tag' || steps.release.outputs.action == 'dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.release.outputs.action }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          if [ "$ACTION" = "tag" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "Release v$VERSION" "$COMMIT"
            # An identical tag object pushed by another run makes this push a successful no-op,
            # so a successful push does not prove this run created the tag: the check below
            # still decides whether to dispatch (#485).
            if ! git push origin "refs/tags/v$VERSION"; then
              # Another run pushed it first and dispatches Release. If its dispatch failed, the
              # next run (or a tag_only dispatch) finds no Release run and dispatches.
              if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
                echo "Tag v$VERSION was pushed by another run; nothing to do."
                exit 0
              fi
              echo "::error::could not push tag v$VERSION"
              exit 1
            fi
            echo "Tagged $COMMIT as v$VERSION"
          fi

          # Dispatch only when no Release run exists for the tag, whichever run pushed it. The
          # recovery case (tag exists, no Release run) still dispatches.
          RUNS=$(gh run list --workflow release.yml --branch "v$VERSION" --limit 1 --json databaseId | jq length)
          if [ "$RUNS" != "0" ]; then
            echo "A Release run already exists for v$VERSION; not dispatching another."
            exit 0
          fi

          # GITHUB_TOKEN tag pushes do not fire `on: push: tags`; workflow_dispatch does.
          gh workflow run release.yml --ref "v$VERSION"

          echo "### Released \`v$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag \`v$VERSION\` at \`$COMMIT\`; dispatched the Release workflow." >> "$GITHUB_STEP_SUMMARY"

  release-pr:
    name: Bump version and open the release PR
    runs-on: ubuntu-latest
    needs: tag
    # After tag, so a release merged without an event is tagged before the next bump.
    if: >-
      !cancelled() && needs.tag.result == 'success' &&
      github.event_name != 'schedule' &&
      ((github.event_name == 'workflow_dispatch' && inputs.tag_only != true) ||
      (github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')))
    concurrency:
      group: auto-tag
      cancel-in-progress: false
    permissions:
      contents: write # push the release branch
      pull-requests: write # open the PR and enable auto-merge
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The same Node as the Headlamp plugin's CI job (ci.yml): the release PR packs the plugin
      # and records its sha256, and the gzip bytes come from Node's zlib (#435).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'

      # Runs scripts/check-lockfile-versions.ts with the same Bun as the Test
      # workflow (ci.yml), which runs the same check on the release PR.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "undefined" ]; then
            echo "::error::could not read version from package.json"
            exit 1
          fi

          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=${PATCH%%-*}

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::unknown bump type: $BUMP"; exit 1 ;;
          esac

          NEXT="$MAJOR.$MINOR.$PATCH"

          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "::error::tag v$NEXT already exists"
            exit 1
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT"       >> "$GITHUB_OUTPUT"
          echo "branch=release/v$NEXT" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEXT ($BUMP)"

      # Bumps, packs the Headlamp plugin and commits without GH_TOKEN in the environment: the
      # plugin's build tooling never sees the token (#435). Only the next step pushes and opens
      # the PR with it.
      - name: Bump versions and commit the release
        env:
          NEXT: ${{ steps.version.outputs.next }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Always rebuild the release branch from the job's main tip.
          # A previous failed run may have left origin/release/vX.Y.Z behind
          # main; plain push then fails non-fast-forward.
          git fetch origin main
          git checkout -B "$BRANCH" origin/main

          # Bump after branch reset so origin/main doesn't wipe package.json.
          # npm version only rewrites the workspace root. Updating workspaces
          # with npm also runs an install and writes package-lock.json, so the
          # published packages are synced with node instead.
          npm version "$NEXT" --no-git-tag-version --allow-same-version
          node scripts/sync-workspace-versions.mjs

          # bun.lock records each workspace package's version. Neither step above
          # updates it, and `bun install --frozen-lockfile` can pass with the old
          # versions, so set them here and check before committing (#260). --write
          # edits only those version lines; nothing is resolved or installed.
          bun scripts/check-lockfile-versions.ts --write
          bun scripts/check-lockfile-versions.ts

          # The Headlamp plugin ships with the platform's version (#435): set it in the plugin's
          # package.json and the chart's plugin manager config, pack the plugin with its own
          # lockfile, and write its Artifact Hub entry from the tarball's sha256. The release
          # build job packs it again at the tag; the release uploads it only if the checksum matches.
          # The recorded sha256 depends on Node's zlib: refuse any Node but the pinned one.
          if [ "$(node -v)" != "v22.23.2" ]; then
            echo "::error::the Headlamp plugin must be packed with Node v22.23.2, not $(node -v)"
            exit 1
          fi
          bun scripts/artifacthub-plugin.ts set-version "$NEXT"
          bun install --cwd platform/operator/headlamp-plugin --frozen-lockfile --ignore-scripts
          bun run --cwd platform/operator/headlamp-plugin package
          bun scripts/artifacthub-plugin.ts write "$NEXT"
          git add platform/operator/chart/values.yaml platform/operator/headlamp-plugin/artifacthub

          # The operator image bakes its default platform version (#431): pin it to the newest
          # published release (never this one, which is not on npm until its tag is released),
          # with its lockfile and the Pulumi plugin digests. A current pin changes nothing.
          bun scripts/operator-project.ts bump
          git add platform/operator/internal/installer/project

          git add package.json bun.lock
          # Workspace manifests are not all under packages/.
          git ls-files -m -- '*package.json' | while IFS= read -r f; do
            git add "$f"
          done
          git add -u package-lock.json yarn.lock pnpm-lock.yaml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::error::nothing to commit for v$NEXT (package.json already at that version?)"
            exit 1
          fi
          git commit -m "chore(release): v$NEXT"

      - name: Open release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          CURRENT: ${{ steps.version.outputs.current }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail

          # Refresh remote-tracking ref so --force-with-lease can replace a stale branch
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || true
          git push -u origin "HEAD:refs/heads/$BRANCH" --force-with-lease

          # Prefer an open PR; otherwise create (closed prior attempts don't block)
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            echo "Reusing open PR #$PR"
          else
            gh pr create \
              --title "chore(release): v$NEXT" \
              --body "$(printf '%s\n' \
                "Automated version bump \`$CURRENT\` → \`$NEXT\` from Auto Tag." \
                "" \
                "The Test workflow runs a Release dry-run on \`release/v*\` PRs" \
                "(\`mx build --sync-versions\`, packed-manifest audit, and" \
                "\`npm publish --dry-run\`) before merge." \
                "" \
                "Merging this PR publishes \`v$NEXT\`: on merge, Auto Tag's scheduled tag job" \
                "(every 30 minutes) tags the commit and dispatches the Release workflow. To tag" \
                "and release sooner, dispatch Auto Tag with \`tag_only: true\`.")" \
              --base main \
              --head "$BRANCH"
            PR=$(gh pr view "$BRANCH" --json number --jq .number)
            echo "Opened PR #$PR"
          fi

          echo "number=$PR" >> "$GITHUB_OUTPUT"

          # Auto-merge when required checks (Test, CodeQL) pass.
          # Repo allows squash/rebase only (ruleset).
          gh pr merge "$PR" --auto --squash || {
            echo "::warning::Could not enable auto-merge (may already be enabled or admin merge required)."
          }

          echo "### Release PR" >> "$GITHUB_STEP_SUMMARY"
          echo "Opened/updated PR #$PR for \`v$NEXT\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Auto-merges after the required checks pass; the tag job tags the merge." >> "$GITHUB_STEP_SUMMARY"
