# Prove every tenant host image variant's patch set applies to the pinned wasmCloud source, and that
# the patched wash and wash-runtime build, lint, format-check and pass the tests that cover the
# patches (#136, #175, #330).
#
# tenant-host-image.yml only runs on main (on push and dispatch), so without this job a patch that
# did not apply, or did not compile, would only show up at publish time, after merge. One job per row of platform/tenant-host/variants (the
# same table the Dockerfile and the publish workflow read), each with that variant's patches applied
# in order, so the canonical set (0002 + 0003) and the exclusive stack (0001 + 0002 + 0003) are both
# checked.
# Each job checks wasmCloud out at the commit pinned by WASMCLOUD_COMMIT in the Dockerfile, runs
# `git apply --check` then `git apply` per patch, then:
#   - `cargo fmt --all -- --check`;
#   - builds and lints (clippy -D warnings, lib and test profile) `-p wash` and `-p wash-runtime` with
#     the image's `wasi-tls` feature;
#   - checks and lints `-p wash --features wasi-tls,host-component-plugins`, a feature the image does
#     not enable but the patches must not break;
#   - runs the patch tests by name and fails if any named test did not run. The allowlist tests
#     (0002) and the NATS blobstore credential tests (0003) run for every variant; the pool and
#     dispatch tests (0001) run where 0001 is applied;
#   - where 0001 is applied, builds the wasm test fixtures (`cargo xtask build-fixtures`) and runs
#     0001's exclusive-instance topology tests (tests/integration_exclusive_topology.rs) by name:
#     the load-time refusal of a linked exclusive component, queueing, a new revision waiting on
#     the old one's host path, and a trap or a timeout in the HTTP handler leaving the queued calls
#     a fresh instance (#144).
# It does not run the whole suites: some need Docker services this job does not set up.
#
# Bounded: one job per variant, 90 minutes each, superseded runs are cancelled. Cached per variant:
# cargo registry, the target directory, the fixtures' target directory and the pinned
# wasm-component-ld are keyed on the pinned commit, the variant and the patch contents; debug info
# is off to keep the cache small. A push to main with the same paths refreshes
# the cache that pull requests restore.
name: Tenant-host patch check

on:
  pull_request:
    paths:
      - 'platform/tenant-host/**'
      - '.github/workflows/tenant-host-patch-check.yml'
  push:
    branches: [main]
    paths:
      - 'platform/tenant-host/**'
      - '.github/workflows/tenant-host-patch-check.yml'

permissions:
  contents: read

concurrency:
  group: tenant-host-patch-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always

jobs:
  variants:
    name: Read the variant table
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.table.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: platform/tenant-host
          sparse-checkout-cone-mode: false

      # Every listed patch must exist, and every patch file must belong to some variant, so a patch
      # cannot be added without being built and tested here.
      - name: Build the matrix from platform/tenant-host/variants
        id: table
        run: |
          set -euo pipefail
          dir=platform/tenant-host
          matrix="$(awk '$1 !~ /^#/ && NF { tag = $1; $1 = ""; sub(/^ +/, ""); print tag "\t" $0 }' "${dir}/variants" \
            | jq -Rnc '[inputs | split("\t") | {tag: .[0], patches: .[1]}]')"
          if [[ "$(jq 'length' <<<"${matrix}")" == 0 ]]; then
            echo "::error::no variants listed in ${dir}/variants"
            exit 1
          fi
          mapfile -t listed < <(jq -r '.[].patches | split(" ")[] | select(. != "")' <<<"${matrix}" | sort -u)
          for patch in "${listed[@]}"; do
            if [[ ! -f "${dir}/${patch}" ]]; then
              echo "::error::${dir}/variants lists ${patch}, which does not exist"
              exit 1
            fi
          done
          shopt -s nullglob
          for file in "${dir}"/*.patch; do
            if ! printf '%s\n' "${listed[@]}" | grep -qxF "$(basename "${file}")"; then
              echo "::error::${file} is not applied by any variant in ${dir}/variants"
              exit 1
            fi
          done
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          jq . <<<"${matrix}"

  patch:
    name: Patch check (${{ matrix.tag }})
    needs: variants
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.variants.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned wasmCloud commit
        id: pin
        run: |
          set -euo pipefail
          commit="$(sed -n 's/^ARG WASMCLOUD_COMMIT=\([0-9a-f]\{40\}\)$/\1/p' platform/tenant-host/Dockerfile)"
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not read WASMCLOUD_COMMIT from platform/tenant-host/Dockerfile"
            exit 1
          fi
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Checkout wasmCloud at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wasmCloud/wasmCloud
          ref: ${{ steps.pin.outputs.commit }}
          path: wasmcloud
          persist-credentials: false

      - name: Verify the checkout is the pinned commit
        run: |
          set -euo pipefail
          test "$(git -C wasmcloud rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"

      - name: Apply the variant's patches in order
        env:
          PATCHES: ${{ matrix.patches }}
        run: |
          set -euo pipefail
          read -ra patches <<<"${PATCHES}"
          if (( ${#patches[@]} == 0 )); then
            echo "::error::variant ${{ matrix.tag }} lists no patches"
            exit 1
          fi
          for patch in "${patches[@]}"; do
            echo "Applying ${patch}"
            git -C wasmcloud apply --check "${GITHUB_WORKSPACE}/platform/tenant-host/${patch}"
            git -C wasmcloud apply "${GITHUB_WORKSPACE}/platform/tenant-host/${patch}"
          done
          git -C wasmcloud diff --stat

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          # rust-toolchain.toml at the pinned commit pins 1.96.0.
          toolchain: '1.96.0'
          components: clippy, rustfmt
          # The wasm test fixtures (exclusive variant) build for these.
          targets: wasm32-wasip1, wasm32-wasip2

      - name: Install protobuf compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            wasmcloud/target
            wasmcloud/crates/wash-runtime/tests/fixtures/target
            ~/.cache/wasm-component-ld
          key: tenant-host-wash-${{ runner.os }}-${{ steps.pin.outputs.commit }}-${{ matrix.tag }}-${{ hashFiles('platform/tenant-host/*.patch') }}
          restore-keys: |
            tenant-host-wash-${{ runner.os }}-${{ steps.pin.outputs.commit }}-${{ matrix.tag }}-

      - name: Check formatting
        working-directory: wasmcloud
        run: cargo fmt --all -- --check

      # The image builds wash with `wasi-tls`, which compiles branches (such as the one in
      # new_ephemeral_store) that a default-features build skips.
      - name: Build patched wash and wash-runtime
        working-directory: wasmcloud
        run: |
          set -euo pipefail
          cargo build -p wash-runtime --locked --features wasi-tls
          cargo build -p wash --locked --features wasi-tls

      - name: Lint patched wash and wash-runtime
        working-directory: wasmcloud
        run: |
          set -euo pipefail
          cargo clippy -p wash-runtime --locked --features wasi-tls -- -D warnings
          cargo clippy -p wash-runtime --locked --features wasi-tls --lib --profile test -- -D warnings
          cargo clippy -p wash --locked --features wasi-tls -- -D warnings
          cargo clippy -p wash --locked --features wasi-tls --lib --profile test -- -D warnings

      # Off in the image, but a supported wash feature: its plugin OciConfig must compile and
      # carry the allowlist.
      - name: Check wash with host-component-plugins
        working-directory: wasmcloud
        run: |
          set -euo pipefail
          cargo check -p wash --locked --features wasi-tls,host-component-plugins
          cargo clippy -p wash --locked --features wasi-tls,host-component-plugins --lib --profile test -- -D warnings

      # 0002: protocol selection (unit and against a loopback listener), washlet propagation, and
      # `wash host` flag/env parsing. 0001 (when applied): the exclusive gates, queueing, trap,
      # timeout and drain tests (instance_pool, instance_driver) and the opt-in surviving the wire
      # conversion (wire_), including the retirement a call that ends faulted takes on the HTTP trap
      # path. 0003 (when applied): NATS blobstore credential parsing, pool keys,
      # credential file reading, and the CONNECT a fake NATS server receives (nats_blobstore_).
      # Each name below must have run and passed.
      - name: Test the patches
        working-directory: wasmcloud
        env:
          PATCHES: ${{ matrix.patches }}
        run: |
          set -euo pipefail
          runtime_filters=(insecure_registr client_protocol test_image_pull_secret_to_oci_config)
          required=(
            oci::tests::client_protocol_insecure_registries_empty_is_https_for_all
            oci::tests::client_protocol_insecure_registries_listed_is_https_except
            oci::tests::client_protocol_insecure_registries_overridden_by_allow_insecure
            oci::tests::pull_insecure_registries_listed_registry_uses_http
            oci::tests::pull_insecure_registries_other_registry_uses_https
            oci::tests::pull_insecure_registries_allow_insecure_uses_http_for_all
            washlet::tests::test_image_pull_secret_to_oci_config_insecure_registries
            cli::host::insecure_registry_tests::insecure_registry_defaults_to_empty
            cli::host::insecure_registry_tests::insecure_registry_flag_is_repeatable_and_comma_delimited
            cli::host::insecure_registry_tests::insecure_registry_env_is_a_comma_list_and_trimmed
            cli::host::insecure_registry_tests::insecure_registry_flag_overrides_env
            cli::host::insecure_registry_tests::insecure_registry_rejects_empty_entries
            cli::host::insecure_registry_tests::insecure_registry_rejects_scheme_prefixed_entries
            cli::host::insecure_registry_tests::insecure_registry_rejects_paths
          )
          if [[ " ${PATCHES} " == *" 0001-exclusive-instance.patch "* ]]; then
            runtime_filters+=(instance_pool instance_driver wire_)
            required+=(
              engine::instance_pool::exclusive_tests::
              engine::instance_pool::exclusive_tests::a_call_finished_faulted_retires_its_instance_before_the_next_is_admitted
            )
          fi
          if [[ " ${PATCHES} " == *" 0003-nats-blobstore-credentials.patch "* ]]; then
            runtime_filters+=(nats_blobstore_)
            required+=(
              plugin::wasi_blobstore::multiplexed::nats::tests::nats_blobstore_auth_without_credential_keys_is_anonymous
              plugin::wasi_blobstore::multiplexed::nats::tests::nats_blobstore_auth_with_both_files_is_user_password_files
              plugin::wasi_blobstore::multiplexed::nats::tests::nats_blobstore_auth_rejects_one_key_without_the_other
              plugin::wasi_blobstore::multiplexed::nats::tests::nats_blobstore_auth_rejects_empty_and_relative_paths
              plugin::wasi_blobstore::multiplexed::nats::tests::nats_blobstore_pool_key_without_credentials_is_the_url
              plugin::wasi_blobstore::multiplexed::nats::tests::nats_blobstore_pool_key_separates_credentials
              plugin::wasi_blobstore::multiplexed::nats::tests::nats_blobstore_pool_key_invalid_credentials_is_not_pooled
              plugin::wasi_blobstore::multiplexed::nats::tests::nats_blobstore_read_credential_drops_one_line_ending
              plugin::wasi_blobstore::multiplexed::nats::tests::nats_blobstore_read_credential_errors_name_the_path_not_the_contents
              plugin::wasi_blobstore::multiplexed::nats::tests::nats_blobstore_connect_sends_user_and_password_from_files
              plugin::wasi_blobstore::multiplexed::nats::tests::nats_blobstore_connect_without_credentials_sends_none
              plugin::wasi_blobstore::multiplexed::nats::tests::nats_blobstore_connect_fails_before_dialing_on_unreadable_credentials
            )
          fi
          log="${RUNNER_TEMP}/patch-tests.log"
          cargo test -p wash-runtime --locked --features wasi-tls --lib -- "${runtime_filters[@]}" 2>&1 | tee "${log}"
          cargo test -p wash --locked --features wasi-tls,host-component-plugins --lib -- insecure_registry 2>&1 | tee -a "${log}"
          for name in "${required[@]}"; do
            if ! grep -qE "^test ${name}[^ ]* \.\.\. ok$" "${log}"; then
              echo "::error::required test ${name} did not run and pass"
              exit 1
            fi
          done

      # 0001's topology tests `include_bytes!` prebuilt wasm components. The toolchain's bundled
      # wasm-component-ld is too old to link the fixtures that use `(implements ..)` imports
      # (keyvalue-implements fails), so the fixtures link with the version wasmCloud's own CI pins
      # (.github/actions/setup-rust at the pinned commit).
      - name: Build the wasm test fixtures
        if: contains(format(' {0} ', matrix.patches), ' 0001-exclusive-instance.patch ')
        working-directory: wasmcloud
        env:
          WASM_COMPONENT_LD_VERSION: '0.5.24'
        run: |
          set -euo pipefail
          # Versioned, so a bump never reuses fixtures linked by the old linker from the cache.
          root="${HOME}/.cache/wasm-component-ld/${WASM_COMPONENT_LD_VERSION}"
          cargo install --locked --root "${root}" "wasm-component-ld@${WASM_COMPONENT_LD_VERSION}"
          export CARGO_TARGET_WASM32_WASIP2_LINKER="${root}/bin/wasm-component-ld"
          "${CARGO_TARGET_WASM32_WASIP2_LINKER}" --version
          cargo xtask build-fixtures

      # 0001: an exclusive component linked into another is refused at load time, one nobody links
      # loads, a lone exclusive component queues real requests, a new revision waits for the old
      # one on the same host path, and a trap in the HTTP handler fails only its own call while the
      # calls queued behind it are served by a fresh instance. So does a call to a guest that yields
      # until the HTTP exchange timeout ends it: the timeout retires the instance. That test reruns
      # itself in a child process with WASH_HTTP_RESPONSE_TIMEOUT_SECS=1. The test target is linted
      # like the lib (it needs the fixtures to compile), then each name below must have run and
      # passed.
      - name: Test the exclusive-instance topology
        if: contains(format(' {0} ', matrix.patches), ' 0001-exclusive-instance.patch ')
        working-directory: wasmcloud
        run: |
          set -euo pipefail
          required=(
            an_exclusive_component_that_is_linked_into_another_is_refused
            an_exclusive_component_nobody_links_is_not_refused_for_its_links
            a_single_exclusive_component_loads_and_queues
            a_new_revision_waits_for_the_old_one_on_the_same_host_path
            an_http_trap_leaves_the_queued_calls_a_fresh_instance
            an_http_timeout_leaves_the_queued_calls_a_fresh_instance
          )
          log="${RUNNER_TEMP}/topology-tests.log"
          cargo clippy -p wash-runtime --locked --features wasi-tls --test integration_exclusive_topology -- -D warnings
          cargo test -p wash-runtime --locked --features wasi-tls --test integration_exclusive_topology 2>&1 | tee "${log}"
          for name in "${required[@]}"; do
            if ! grep -qE "^test ${name} \.\.\. ok$" "${log}"; then
              echo "::error::required topology test ${name} did not run and pass"
              exit 1
            fi
          done
