# Prove the pglite-component engine build is byte-reproducible (#267): build the PostgreSQL engine
# twice from clean copies of the package, at different paths, and require identical sha256 digests
# for pglite.wasi, engine.core.wasm, engine.wasm and the embedded support filesystem
# (`make reproducible`, scripts/check-reproducible.ts).
#
# Two full engine source builds are too slow for every ci.yml run, so this job only runs when an
# engine input changes. It uses no cache: a restored engine would not be a clean build.
name: pglite engine reproducibility

on:
  pull_request:
    paths:
      - 'platform/pglite-component/engine/**'
      - 'platform/pglite-component/scripts/build-engine.ts'
      - 'platform/pglite-component/scripts/patch-engine-source.ts'
      - 'platform/pglite-component/scripts/prepare-engine.ts'
      - 'platform/pglite-component/scripts/check-reproducible.ts'
      - 'platform/pglite-component/scripts/install-tools.ts'
      - 'platform/pglite-component/scripts/lib/**'
      - 'platform/pglite-component/Makefile'
      - 'platform/pglite-component/scripts/tool-versions.env'
      - 'platform/pglite-component/wit/deps/pglite-engine/**'
      - '.github/workflows/pglite-engine-reproducible.yml'
  push:
    branches: [main]
    paths:
      - 'platform/pglite-component/engine/**'
      - 'platform/pglite-component/scripts/build-engine.ts'
      - 'platform/pglite-component/scripts/patch-engine-source.ts'
      - 'platform/pglite-component/scripts/prepare-engine.ts'
      - 'platform/pglite-component/scripts/check-reproducible.ts'
      - 'platform/pglite-component/scripts/install-tools.ts'
      - 'platform/pglite-component/scripts/lib/**'
      - 'platform/pglite-component/Makefile'
      - 'platform/pglite-component/scripts/tool-versions.env'
      - 'platform/pglite-component/wit/deps/pglite-engine/**'
      - '.github/workflows/pglite-engine-reproducible.yml'

permissions:
  contents: read

concurrency:
  group: pglite-engine-reproducible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducible:
    name: Two clean engine builds match
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # Each engine build needs the 1.3 GB SDK tarballs, the builder image and the PostgreSQL tree.
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Wasm build tools
        run: make -C platform/pglite-component tools

      - name: Build the engine twice and compare digests
        run: make -C platform/pglite-component reproducible
