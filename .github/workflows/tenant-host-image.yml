# Publish the tenant host image: wash 2.8.0 with wasi-tls.
# On workflow_dispatch, builds the selected variant. On push to main, builds both variants.
#
# Two variants, chosen by the `variant` input. Each has its own tag and its own cache, so a patched
# build can never move the canonical tag (#136):
#   wasi-tls            ghcr.io/di-framework/wash:2.8.0-wasi-tls            stock source, no patches
#   wasi-tls-exclusive  ghcr.io/di-framework/wash:2.8.0-wasi-tls-exclusive  + 0001-exclusive-instance.patch
# The image labels name the variant and the patches applied. The platform default hostImage stays
# pinned to the canonical digest; the exclusive variant is only used by setting tenantHostImage to its digest.
# The exclusive build is never the default: select it explicitly.
#
# amd64 and arm64 compile at the same time on native runners. One ubuntu-24.04
# job plus QEMU was spending the arm64 release build in emulation, which is
# what made a cold publish take the better part of an hour.
# Each arch also pushes a registry cache manifest (mode=max). That manifest is
# the metadata that points BuildKit at layer blobs already in GHCR, including
# the builder stage, so a later publish of the same Dockerfile does
# not run cargo again. It is not the wash tag itself: inline cache on that tag
# is min mode and omits the builder stage.
# cancel-in-progress stays false so a queued publish waits and does not abort
# one that is already compiling.
# Auth is GITHUB_TOKEN with packages: write. No registry secret is stored.
name: Publish tenant host image

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Image variant (select wasi-tls-exclusive explicitly; it is published under its own tag)
        type: choice
        options:
          - wasi-tls
          - wasi-tls-exclusive
        default: wasi-tls
  push:
    branches: [main]
    paths:
      - 'platform/tenant-host/**'
      - '.github/workflows/tenant-host-image.yml'

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-tenant-host-image
  cancel-in-progress: false

jobs:
  variant:
    name: Resolve variants
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      variants: ${{ steps.resolve.outputs.variants }}
    steps:
      - name: Resolve variants for this trigger
        id: resolve
        env:
          VARIANT: ${{ inputs.variant }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${TRIGGER}" == "workflow_dispatch" ]]; then
            # On dispatch, use the selected variant
            variants="[{\"name\":\"${VARIANT}\"}]"
          else
            # On push to main, build both variants
            variants='[{"name":"wasi-tls"},{"name":"wasi-tls-exclusive"}]'
          fi
          echo "variants=${variants}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.variant.name }} on ${{ matrix.platform }}
    needs: variant
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.variant.outputs.variants) }}
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Require di-framework/platform
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "di-framework/platform" ]]; then
            echo "::error::This workflow publishes ghcr.io/di-framework/wash and only runs in di-framework/platform"
            exit 1
          fi

      - name: Resolve tag and patches
        id: variant
        env:
          VARIANT: ${{ matrix.variant.name }}
        run: |
          set -euo pipefail
          case "${VARIANT}" in
            wasi-tls) patches='' ;;
            wasi-tls-exclusive) patches='0001-exclusive-instance.patch' ;;
            *)
              echo "::error::unknown variant '${VARIANT}'"
              exit 1
              ;;
          esac
          echo "tag=2.8.0-${VARIANT}" >> "${GITHUB_OUTPUT}"
          echo "patches=${patches}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: platform/tenant-host
          platforms: ${{ matrix.platform }}
          provenance: true
          build-args: |
            WASH_PATCHES=${{ steps.variant.outputs.patches }}
            IMAGE_VERSION=${{ steps.variant.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=ghcr.io/di-framework/wash,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/di-framework/wash:buildcache-${{ steps.variant.outputs.tag }}-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/di-framework/wash:buildcache-${{ steps.variant.outputs.tag }}-${{ matrix.arch }},mode=max,oci-mediatypes=true,image-manifest=true

      - name: Export digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [[ "${digest}" != sha256:* ]]; then
            echo "::error::build did not return a digest"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          : > "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wash-digest-${{ steps.variant.outputs.tag }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push tenant host image tags
    needs: [variant, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.variant.outputs.variants) }}
    steps:
      - name: Require di-framework/platform
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "di-framework/platform" ]]; then
            echo "::error::This workflow publishes ghcr.io/di-framework/wash and only runs in di-framework/platform"
            exit 1
          fi

      - name: Resolve tag and patches
        id: variant
        env:
          VARIANT: ${{ matrix.variant.name }}
        run: |
          set -euo pipefail
          case "${VARIANT}" in
            wasi-tls) patches='' ;;
            wasi-tls-exclusive) patches='0001-exclusive-instance.patch' ;;
            *)
              echo "::error::unknown variant '${VARIANT}'"
              exit 1
              ;;
          esac
          echo "tag=2.8.0-${VARIANT}" >> "${GITHUB_OUTPUT}"
          echo "patches=${patches}" >> "${GITHUB_OUTPUT}"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wash-digest-${{ steps.variant.outputs.tag }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ steps.variant.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f | sort)
          if (( ${#files[@]} != 2 )); then
            echo "::error::expected 2 image digests, found ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          args=()
          for file in "${files[@]}"; do
            hex="$(basename "${file}")"
            if [[ ! "${hex}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::unexpected digest file ${hex}"
              exit 1
            fi
            args+=("ghcr.io/di-framework/wash@sha256:${hex}")
          done
          # --metadata-file is the index that was just pushed. Piping
          # `imagetools inspect` into awk exits at the first Digest line, which
          # closes the pipe and fails this job after the tag is already published.
          docker buildx imagetools create \
            --metadata-file "${RUNNER_TEMP}/wash-index.json" \
            -t "ghcr.io/di-framework/wash:${TAG}" \
            "${args[@]}"

      - name: Record image digest
        env:
          TAG: ${{ steps.variant.outputs.tag }}
          PATCHES: ${{ steps.variant.outputs.patches }}
        run: |
          set -euo pipefail
          digest="$(jq -er '.["containerimage.descriptor"].digest' "${RUNNER_TEMP}/wash-index.json")"
          if [[ "${digest}" != sha256:* ]]; then
            echo "::error::manifest list did not return an index digest"
            cat "${RUNNER_TEMP}/wash-index.json"
            exit 1
          fi
          ref="ghcr.io/di-framework/wash:${TAG}@${digest}"
          echo "Published ${ref}"
          {
            echo "### Tenant host image (${PATCHES:-wasi-tls})"
            echo
            echo '```'
            echo "${ref}"
            echo '```'
            echo
            echo "Patches applied: \`${PATCHES:-none}\`"
            echo
            echo "Pin \`tenantHostImage\` to that digest. The tag \`${TAG}\` moves on the next publish of this variant."
            if [[ -n "${PATCHES}" ]]; then
              echo
              echo 'This is a patched build. Use it only by setting `tenantHostImage` (digest-pinned) until it is proven; do not change `DEFAULT_HOST_IMAGE`.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
