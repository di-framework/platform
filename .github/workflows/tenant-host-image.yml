# Publish the tenant host image: wash 2.8.0 with wasi-tls and the postgres
# invocation-lease patch. Runs when this workflow or its build inputs change.
# A push to main publishes ghcr.io/di-framework/wash:2.8.0-wasi-tls. A pull
# request builds the same image and does not push, so the tag is not moved
# before merge. Auth is GITHUB_TOKEN with packages: write. No registry secret
# is stored.
name: Publish tenant host image

on:
  push:
    branches: [main]
    paths: &image-paths
      - .github/workflows/tenant-host-image.yml
      - platform/tenant-host/Dockerfile
      - platform/tenant-host/postgres-invocation-lease.patch
  pull_request:
    paths: *image-paths

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: tenant-host-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: Tenant host image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Require di-framework/platform
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "di-framework/platform" ]]; then
            echo "::error::This workflow publishes ghcr.io/di-framework/wash and only runs in di-framework/platform"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: platform/tenant-host
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: true
          tags: ghcr.io/di-framework/wash:2.8.0-wasi-tls
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" || "${DIGEST}" != sha256:* ]]; then
            echo "::error::build did not return an index digest"
            exit 1
          fi
          ref="ghcr.io/di-framework/wash:2.8.0-wasi-tls@${DIGEST}"
          echo "Published ${ref}"
          {
            echo "### Tenant host image"
            echo
            echo '```'
            echo "${ref}"
            echo '```'
            echo
            echo 'Pin `tenantHostImage` to that digest. The tag `2.8.0-wasi-tls` moves on the next publish.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Note pull request build
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### Tenant host image"
            echo
            echo "Built linux/amd64 and linux/arm64. Pull requests do not push, so \`ghcr.io/di-framework/wash:2.8.0-wasi-tls\` stays on the last main publish."
          } >> "${GITHUB_STEP_SUMMARY}"
