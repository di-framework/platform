# Publish the canonical Wasm OCI artifact through the Rust publisher and wash.
name: Publish oci-registry component

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'platform/oci-registry/**'
      - 'platform/wasm-component-publisher/**'
      - 'platform/sqlite-component/scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/actions/setup-tenant-auth-builder/**'
      - '.github/workflows/oci-registry-component.yml'

permissions:
  contents: read

concurrency:
  group: publish-oci-registry-component
  cancel-in-progress: false

jobs:
  check-source:
    name: Check if source already published
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      source-hash: ${{ steps.hash.outputs.source-hash }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute source hash
        id: hash
        run: |
          set -euo pipefail
          hash=$(git ls-tree -r HEAD -- \
            platform/oci-registry \
            platform/wasm-component-publisher \
            platform/sqlite-component/scripts \
            Cargo.toml \
            Cargo.lock \
            .cargo \
            .github/actions/setup-tenant-auth-builder \
            .github/workflows/oci-registry-component.yml | sha256sum | cut -d' ' -f1)
          echo "source-hash=${hash}" >> "${GITHUB_OUTPUT}"
          echo "Source hash: ${hash}"

      - name: Set up oras
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Check if already published
        id: check
        env:
          SOURCE_HASH: ${{ steps.hash.outputs.source-hash }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="src-${SOURCE_HASH}"
          if echo "${GHCR_TOKEN}" | oras login ghcr.io --username "${GHCR_USERNAME}" --password-stdin 2>/dev/null; then
            if oras manifest fetch "ghcr.io/di-framework/oci-registry:${tag}" >/dev/null 2>&1; then
              echo "Source hash tag already exists: ${tag}"
              echo "skip=true" >> "${GITHUB_OUTPUT}"
            else
              echo "skip=false" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "Could not authenticate to GHCR, will proceed with build"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

  publish:
    name: Push ghcr.io/di-framework/oci-registry
    needs: check-source
    if: >-
      ${{ github.ref == 'refs/heads/main' && !cancelled() &&
      (needs.check-source.result == 'skipped' ||
      (needs.check-source.result == 'success' && needs.check-source.outputs.skip != 'true')) }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require di-framework/platform
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != di-framework/platform ]]; then
            echo '::error::Only di-framework/platform can publish this component'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust and native dependencies
        uses: ./.github/actions/setup-tenant-auth-builder

      - name: Install Wasm build tools
        run: |
          set -euo pipefail
          rustup target add --toolchain 1.97.1 wasm32-wasip2
          bash platform/sqlite-component/scripts/install-tools.sh
          echo "$GITHUB_WORKSPACE/platform/sqlite-component/.tools/bin" >> "$GITHUB_PATH"

      - name: Set up wash CLI
        uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: v2.5.2

      - name: Test component and publisher
        run: |
          set -euo pipefail
          make -C platform/oci-registry test
          cargo test --locked -p wasm-component-publisher -p oci-registry-publisher

      - name: Build publisher (no credentials in scope)
        run: cargo build --locked -p oci-registry-publisher

      - name: Build, push, and verify component
        env:
          PUSH: 'true'
          DI_OCI_REGISTRY: ghcr.io
          DI_OCI_CLUSTER_REGISTRY: ghcr.io
          DI_OCI_REPOSITORY: di-framework/oci-registry
          DI_OCI_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: target/debug/oci-registry-publisher

      - name: Record component digest
        id: digest
        run: |
          set -euo pipefail
          report=platform/oci-registry/dist/publish-report.json
          digest="$(jq -er '.manifestDigest | select(test("^sha256:[0-9a-f]{64}$"))' "$report")"
          ref="ghcr.io/di-framework/oci-registry@${digest}"
          printf 'Published %s\n' "$ref"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo '### Tenant OCI registry component'
            echo
            printf '```\n%s\n```\n' "$ref"
            echo
            echo 'The component was pulled by digest and verified against the local build.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag with source hash
        if: github.event_name == 'push' && needs.check-source.outputs.source-hash
        env:
          SOURCE_HASH: ${{ needs.check-source.outputs.source-hash }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | oras login ghcr.io --username "${GHCR_USERNAME}" --password-stdin
          tag="src-${SOURCE_HASH}"
          oras tag "ghcr.io/di-framework/oci-registry@${DIGEST}" "${tag}"
          echo "Tagged with: ${tag}"

      - name: Upload publish report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oci-registry-publish-report
          path: platform/oci-registry/dist/publish-report.json
          if-no-files-found: error
