# Publish the canonical Wasm OCI artifact through the Rust publisher, oras and wash.
#
# Triggers (#172): a push to main that touches one of the paths below, and workflow_dispatch.
# check-source hashes the committed files in on.push.paths (scripts/source-check.ts); on a push
# the publish is skipped when ghcr.io/di-framework/oci-registry:src-<hash> already exists. A
# dispatch always publishes. publish tags the manifest src-<hash>, and pin opens the bot PR
# "chore: pin oci-registry to <digest>" (scripts/pin-artifact.ts).
#
# Permissions: workflow default contents: read. publish builds, tests and pushes in one job
# (packages: write), as before; only pin holds contents: write and pull-requests: write.
name: Publish oci-registry component

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'platform/oci-registry/**'
      - 'platform/wasm-component-publisher/**'
      - 'platform/sqlite-component/scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/actions/setup-tenant-auth-builder/**'
      - '.github/workflows/oci-registry-component.yml'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: publish-oci-registry-component
  cancel-in-progress: false

jobs:
  check-source:
    name: Check if source already published
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      source-hash: ${{ steps.check.outputs.hash }}
      skip: ${{ steps.check.outputs.skip }}
      stale: ${{ steps.check.outputs.stale }}
      digest: ${{ steps.check.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up source check
        uses: ./.github/actions/setup-source-check
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # On a push, skip=true when oci-registry:src-<hash> exists; a dispatch always builds.
      - name: Check if already published
        id: check
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
          SOURCE_CHECK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # FORCE is empty or one flag
          bun scripts/source-check.ts --workflow .github/workflows/oci-registry-component.yml \
            --image ghcr.io/di-framework/oci-registry --stale-guard ${FORCE} --github-output

  publish:
    name: Push ghcr.io/di-framework/oci-registry
    needs: check-source
    if: ${{ !cancelled() && needs.check-source.result == 'success' && needs.check-source.outputs.skip != 'true' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require di-framework/platform
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != di-framework/platform ]]; then
            echo '::error::Only di-framework/platform can publish this component'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust and native dependencies
        uses: ./.github/actions/setup-tenant-auth-builder

      - name: Install Wasm build tools
        run: |
          set -euo pipefail
          rustup target add --toolchain 1.97.1 wasm32-wasip2
          bash platform/sqlite-component/scripts/install-tools.sh
          echo "$GITHUB_WORKSPACE/platform/sqlite-component/.tools/bin" >> "$GITHUB_PATH"

      - name: Set up wash CLI
        uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: v2.5.2

      # The publisher pushes the component, its config and manifest with oras (no wall-clock
      # time, so an unchanged component keeps its digest); wash pulls it back by digest.
      - name: Set up ORAS
        uses: ./.github/actions/setup-oras

      - name: Test component and publisher
        run: |
          set -euo pipefail
          make -C platform/oci-registry test
          cargo test --locked -p wasm-component-publisher -p oci-registry-publisher

      - name: Build publisher (no credentials in scope)
        run: cargo build --locked -p oci-registry-publisher

      # Right before the tags move: a re-run of an older push whose inputs main has since
      # changed stops here (check-source is not re-run by "Re-run failed jobs").
      - name: Stop if main has newer inputs
        id: guard
        uses: ./.github/actions/source-guard
        with:
          workflow: .github/workflows/oci-registry-component.yml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, push, and verify component
        if: steps.guard.outputs.stale != 'true'
        env:
          PUSH: 'true'
          # Cleared so no exported value reaches the publisher: a per-commit created time
          # would give an unchanged component a new digest on every publish.
          SOURCE_DATE_EPOCH: ''
          DI_OCI_REGISTRY: ghcr.io
          DI_OCI_CLUSTER_REGISTRY: ghcr.io
          DI_OCI_REPOSITORY: di-framework/oci-registry
          DI_OCI_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: target/debug/oci-registry-publisher

      - name: Record component digest
        if: steps.guard.outputs.stale != 'true'
        id: digest
        run: |
          set -euo pipefail
          report=platform/oci-registry/dist/publish-report.json
          digest="$(jq -er '.manifestDigest | select(test("^sha256:[0-9a-f]{64}$"))' "$report")"
          ref="ghcr.io/di-framework/oci-registry@${digest}"
          printf 'Published %s\n' "$ref"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo '### Tenant OCI registry component'
            echo
            # shellcheck disable=SC2016 # the backticks are Markdown, not expansions
            printf '```\n%s\n```\n' "$ref"
            echo
            echo 'The component was pulled by digest and verified against the local build.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag with source hash
        if: steps.guard.outputs.stale != 'true'
        env:
          SOURCE_HASH: ${{ needs.check-source.outputs.source-hash }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_HASH}" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::missing source hash'
            exit 1
          fi
          printf '%s' "${GHCR_TOKEN}" | oras login ghcr.io --username "${GHCR_USERNAME}" --password-stdin
          oras tag "ghcr.io/di-framework/oci-registry@${DIGEST}" "src-${SOURCE_HASH}"
          echo "Tagged ghcr.io/di-framework/oci-registry@${DIGEST} with src-${SOURCE_HASH}"

      - name: Upload publish report
        if: steps.guard.outputs.stale != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oci-registry-publish-report
          path: platform/oci-registry/dist/publish-report.json
          if-no-files-found: error

  pin:
    name: Open pin PR
    # After a publish, or when this push's source was already published (a revert to an older
    # source, or a pin PR closed unmerged): then check-source's digest is pinned again.
    # pin-artifact.ts finds nothing to change when main already has it, so that is a no-op.
    needs: [check-source, publish]
    if: >-
      ${{ !cancelled() && needs.check-source.result == 'success' && github.ref == 'refs/heads/main' &&
      ((needs.publish.result == 'success' && needs.publish.outputs.digest != '') ||
      (needs.check-source.outputs.skip == 'true' && needs.check-source.outputs.stale != 'true' &&
      needs.check-source.outputs.digest != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open pin PR
        uses: ./.github/actions/open-pin-pr
        with:
          name: oci-registry
          workflow: .github/workflows/oci-registry-component.yml
          pins: oci-registry ${{ needs.publish.outputs.digest || needs.check-source.outputs.digest }}
          token: ${{ secrets.GITHUB_TOKEN }}
