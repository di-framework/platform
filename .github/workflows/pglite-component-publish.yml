# Publish the tested, composed pglite Wasm component (engine plugged in) to GHCR.
# The build job runs the same make targets as ci.yml and holds no write token;
# the publish job only validates and pushes the already-tested dist/.
#
# Triggers (#172): a push to main that touches one of the paths below, and workflow_dispatch.
# check-source hashes the committed files in on.push.paths (scripts/source-check.ts); on a push
# the build is skipped when ghcr.io/di-framework/pglite-component:src-<hash> already exists. A
# dispatch always builds. publish tags the manifest src-<hash>, and pin opens the bot PR
# "chore: pin pglite-component to <digest>" (scripts/pin-artifact.ts). Only pin holds
# contents: write and pull-requests: write; only publish holds packages: write.
name: Publish pglite component

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'platform/pglite-component/src/**'
      - 'platform/pglite-component/wit/**'
      - 'platform/pglite-component/engine/**'
      - 'platform/pglite-component/build-support/**'
      - 'platform/pglite-component/scripts/**'
      - 'platform/pglite-component/Makefile'
      - 'platform/pglite-component/build.rs'
      - 'platform/pglite-component/Cargo.toml'
      - 'platform/pglite-component/Cargo.lock'
      - 'platform/pglite-component/rust-toolchain.toml'
      - 'platform/wasm-component-publisher/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/pglite-component-publish.yml'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: publish-pglite-component
  cancel-in-progress: false

jobs:
  check-source:
    name: Check if source already published
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      source-hash: ${{ steps.check.outputs.hash }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up source check
        uses: ./.github/actions/setup-source-check
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # On a push, skip=true when pglite-component:src-<hash> exists; a dispatch always builds.
      - name: Check if already published
        id: check
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # FORCE is empty or one flag
          bun scripts/source-check.ts --workflow .github/workflows/pglite-component-publish.yml \
            --image ghcr.io/di-framework/pglite-component --require-main-tip "${GITHUB_SHA}" ${FORCE} --github-output

  build:
    name: Build and test pglite component
    needs: check-source
    if: ${{ !cancelled() && needs.check-source.result == 'success' && needs.check-source.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      wasm_sha256: ${{ steps.dist.outputs.wasm_sha256 }}
    steps:
      - name: Require di-framework/platform
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != di-framework/platform ]]; then
            echo '::error::Only di-framework/platform can publish this component'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.97.1'
          targets: wasm32-wasip2
          components: clippy

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 'v48.0.1'

      - name: Cache engine build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            platform/pglite-component/target/engine
            platform/pglite-component/.tools
          key: pglite-engine-${{ hashFiles('platform/pglite-component/engine/**', 'platform/pglite-component/scripts/tool-versions.env', 'platform/pglite-component/scripts/build-engine.ts', 'platform/pglite-component/scripts/patch-engine-source.ts', 'platform/pglite-component/scripts/prepare-engine.ts', 'platform/pglite-component/wit/deps/pglite-engine/**') }}
          restore-keys: |
            pglite-engine-

      - name: Install Wasm build tools
        run: |
          set -euo pipefail
          make -C platform/pglite-component tools-rust
          echo "$GITHUB_WORKSPACE/platform/pglite-component/.tools/bin" >> "$GITHUB_PATH"

      - name: Test publisher crates
        run: |
          set -euo pipefail
          cargo clippy --locked -p wasm-component-publisher -p pglite-component-publisher --all-targets -- -D warnings
          cargo test --locked -p wasm-component-publisher -p pglite-component-publisher

      # `smoke` runs `build`, which wac-plugs the engine into the provider.
      - name: Build and test composed component against the real engine
        run: make -C platform/pglite-component unit smoke

      - name: Validate the tested artifact without publishing
        run: cargo run --locked -p pglite-component-publisher -- --check

      - name: Record tested wasm digest
        id: dist
        run: |
          set -euo pipefail
          sum="$(sha256sum platform/pglite-component/dist/di-framework-pglite.wasm | cut -d' ' -f1)"
          echo "wasm_sha256=${sum}" >> "$GITHUB_OUTPUT"

      - name: Upload tested dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pglite-dist
          path: platform/pglite-component/dist/
          if-no-files-found: error

  publish:
    name: Push ghcr.io/di-framework/pglite-component
    needs: [check-source, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.97.1'

      - name: Set up wash CLI
        uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: v2.5.2

      # oras points the version tag at the manifest wash pushed, so every tag
      # shares one digest. Pinned by version and checksum.
      - name: Install oras
        run: |
          set -euo pipefail
          version=1.3.4
          sha256=f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/oras.tar.gz "https://github.com/oras-project/oras/releases/download/v${version}/oras_${version}_linux_amd64.tar.gz"
          echo "${sha256}  /tmp/oras.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/oras.tar.gz -C /usr/local/bin oras
          oras version

      - name: Build publisher (no credentials in scope)
        run: cargo build --locked -p pglite-component-publisher

      - name: Download tested dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pglite-dist
          path: platform/pglite-component/dist

      - name: Verify dist is the tested build
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.wasm_sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum platform/pglite-component/dist/di-framework-pglite.wasm | cut -d' ' -f1)"
          if [[ -z "$EXPECTED_SHA256" || "$actual" != "$EXPECTED_SHA256" ]]; then
            echo "::error::downloaded wasm ($actual) differs from the tested build ($EXPECTED_SHA256)"
            exit 1
          fi

      # The publisher re-verifies SHA256SUMS, the exported database interface
      # and that every import is wasi:*, then pushes the commit and version
      # tag, pulls it back by digest, and points the
      # version tag at that same manifest.
      - name: Push and verify component
        env:
          PUSH: 'true'
          DI_OCI_REGISTRY: ghcr.io
          DI_OCI_CLUSTER_REGISTRY: ghcr.io
          DI_OCI_REPOSITORY: di-framework/pglite-component
          DI_OCI_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: target/debug/pglite-component-publisher

      - name: Record component digest
        id: digest
        run: |
          set -euo pipefail
          report=platform/pglite-component/dist/publish-report.json
          digest="$(jq -er '.manifestDigest | select(test("^sha256:[0-9a-f]{64}$"))' "$report")"
          ref="ghcr.io/di-framework/pglite-component@${digest}"
          printf 'Published %s\n' "$ref"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo '### PGlite component'
            echo
            # shellcheck disable=SC2016 # the backticks are Markdown, not expansions
            printf '```\n%s\n```\n' "$ref"
            echo
            echo 'Tags (movable): the commit SHA and the WIT package version, both pointing at the digest above.'
            echo 'Only the digest is immutable. The pushed manifest was pulled back by digest and byte-compared with the tested build.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag with source hash
        env:
          SOURCE_HASH: ${{ needs.check-source.outputs.source-hash }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_HASH}" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::missing source hash'
            exit 1
          fi
          printf '%s' "${GHCR_TOKEN}" | oras login ghcr.io --username "${GHCR_USERNAME}" --password-stdin
          oras tag "ghcr.io/di-framework/pglite-component@${DIGEST}" "src-${SOURCE_HASH}"
          echo "Tagged ghcr.io/di-framework/pglite-component@${DIGEST} with src-${SOURCE_HASH}"

      - name: Upload publish report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pglite-publish-report
          path: platform/pglite-component/dist/publish-report.json
          if-no-files-found: error

  pin:
    name: Open pin PR
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open pin PR
        uses: ./.github/actions/open-pin-pr
        with:
          name: pglite-component
          pins: pglite-component ${{ needs.publish.outputs.digest }}
          token: ${{ secrets.GITHUB_TOKEN }}
