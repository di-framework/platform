name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a PR's superseded runs; every push to main still runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Only what build-engine.ts checks before skipping the engine source build (a few MB);
  # prepare-engine.ts rebuilds the rest in seconds.
  ENGINE_CACHE_PATHS: |
    platform/pglite-component/target/engine/source-stamp
    platform/pglite-component/target/engine/pglite-source.tar.xz
  # Cargo target directories of the Wasm components (cargo's fingerprints decide what is reused).
  RUST_CACHE_PATHS: |
    target
    platform/pglite-component/target
    !platform/pglite-component/target/engine
    platform/pglite-encfs/target
    platform/oci-registry/target
    platform/sqlite-component/target

jobs:
  operator:
    name: Operator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: platform/operator/go.mod
          cache-dependency-path: platform/operator/go.sum

      # Generated DeepCopy, CRD and ClusterRole must match the API markers; gofmt, vet and tests.
      - name: Check
        working-directory: platform/operator
        run: make check

  # The Headlamp plugin is a standalone package (own bun.lock, vitest), outside the root
  # workspaces, so it gets its own job. Its checks run when a PR touches the plugin, the CRD its
  # tests validate against, or this workflow; pushes to main always run them.
  headlamp-plugin:
    name: Headlamp plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/operator/headlamp-plugin
    steps:
      # Depth 2 is enough: a pull_request run checks out the merge commit, whose first parent is
      # the base branch it merges into.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check for plugin changes
        id: changes
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            ! git diff --quiet HEAD^1 HEAD -- \
              platform/operator/headlamp-plugin \
              platform/operator/config/crd \
              .github/workflows/ci.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Headlamp plugin changes; skipping its checks."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.changes.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      # The package step gzips with Node's zlib, so its sha256 depends on the Node version: pin it.
      - name: Setup Node
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Lint
        if: steps.changes.outputs.run == 'true'
        run: bun run lint

      - name: Typecheck
        if: steps.changes.outputs.run == 'true'
        run: bun run tsc

      # 100% lines, statements, functions and branches (vitest.config.mjs).
      - name: Test with coverage
        if: steps.changes.outputs.run == 'true'
        run: bun run test:coverage

      # Deterministic tarball for Headlamp's plugin manager; the release attaches it later.
      - name: Package
        if: steps.changes.outputs.run == 'true'
        run: |
          bun run package
          cat dist-package/*.sha256

      # The release PR adds the Artifact Hub entry (#435) for the plugin's new version; that PR's
      # pack must match it, and so must any PR that edits or deletes that entry (a deleted entry
      # fails). Other PRs leave a released entry alone (later plugin changes pack to other bytes
      # under the same version until the next release), and pushes skip the check.
      - name: Check the Artifact Hub entry
        if: steps.changes.outputs.run == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "Not a pull request; the Artifact Hub entry is checked on the PR that changes it."
            exit 0
          fi
          VERSION="$(node -p "require('./platform/operator/headlamp-plugin/package.json').version")"
          ENTRY="platform/operator/headlamp-plugin/artifacthub/$VERSION/"
          # HEAD is the merge commit; its first parent is the PR base.
          if [ -n "$(git diff --name-only HEAD^1 HEAD -- "$ENTRY")" ]; then
            bun scripts/artifacthub-plugin.ts verify "$VERSION" --required
          else
            echo "This PR does not change $ENTRY; nothing to verify."
          fi

      - name: Upload plugin tarball
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headlamp-plugin
          path: |
            platform/operator/headlamp-plugin/dist-package/*.tar.gz
            platform/operator/headlamp-plugin/dist-package/*.sha256
          if-no-files-found: error
          retention-days: 30

  # TypeScript checks and `bun test`. The tests need the built pglite and OCI registry
  # components, so this job builds them too; their own Rust tests run in `components`.
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Install SQLite build toolchain
        run: |
          bash platform/sqlite-component/scripts/install-tools.sh --rust
          echo "$GITHUB_WORKSPACE/platform/sqlite-component/.tools/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --frozen-lockfile can pass while bun.lock still records old workspace
      # versions (#260), so check them explicitly.
      - name: Check bun.lock workspace versions
        run: bun scripts/check-lockfile-versions.ts

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      # The prototype Pulumi program is outside the root tsconfig; Pulumi's runtime type-checks it
      # with ts-node and its own TypeScript 5 install, so check it the same way (#251).
      - name: Typecheck backup prototype Pulumi program
        working-directory: platform/backup-destination/prototype
        run: |
          bun install --frozen-lockfile --ignore-scripts
          ./node_modules/.bin/tsc --noEmit -p .

      - name: Lint
        run: bun run lint

      # Only `components` saves this cache; on a miss both jobs build the engine.
      - name: Restore PGlite engine source build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ENGINE_CACHE_PATHS }}
          key: pglite-engine-source-${{ hashFiles('platform/pglite-component/engine/**', 'platform/pglite-component/scripts/build-engine.ts', 'platform/pglite-component/scripts/patch-engine-source.ts', 'platform/pglite-component/scripts/tool-versions.env') }}

      - name: Cache Rust build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RUST_CACHE_PATHS }}
          key: rust-${{ github.job }}-${{ hashFiles('Cargo.lock', 'platform/*/Cargo.lock', 'platform/*/rust-toolchain.toml', 'platform/pglite-component/scripts/tool-versions.env') }}
          restore-keys: rust-${{ github.job }}-

      # Builds the engine before the dry-run, which runs the package's `bun run build`
      # (adapter + `make build`) and then reuses the engine and cargo caches.
      - name: Build embedded PGlite component
        run: make -C platform/pglite-component tools-rust build

      - name: Build tenant OCI registry component
        run: make -C platform/oci-registry build

      - name: Dry-run package publish
        run: bun scripts/publish-workspace.ts --dry-run

      - name: Test
        env:
          PGLITE_REQUIRE_DIST: '1'
          OCI_REGISTRY_REQUIRE_DIST: '1'
        run: bun test --coverage

      - name: Export coverage summary & Shields badge JSON
        run: |
          bun -e '
            import { readFileSync, existsSync, appendFileSync } from "node:fs";
            import { resolve } from "node:path";
            import {
              getWorkspacePackages,
              parseLcov,
              calculatePackageMetrics,
              writeShieldBadgeFiles,
            } from "./scripts/coverage-mapping";

            const packages = getWorkspacePackages(resolve(process.cwd()));
            const lcovPath = resolve(process.cwd(), "coverage/lcov.info");

            if (!existsSync(lcovPath)) {
              console.log("No coverage/lcov.info; skipping badge export");
              process.exit(0);
            }

            const lcovContent = readFileSync(lcovPath, "utf8");
            const records = parseLcov(lcovContent);
            const metrics = calculatePackageMetrics(packages, records);

            const badgeDir = resolve(process.cwd(), "coverage/badges");
            const written = writeShieldBadgeFiles(metrics, badgeDir);
            console.log(`Wrote ${written.length} Shields endpoint JSON file(s) to ${badgeDir}`);

            let md = "### 📊 Code Coverage Summary\n\n| Package | Line Coverage | Lines Hit / Total |\n| --- | --- | --- |\n";
            for (const m of metrics) {
              const details = m.isMeasured ? `${m.lh}/${m.lf}` : "N/A (" + m.unmeasuredReason + ")";
              md += `| \`${m.name}\` | **${m.status}** | ${details} |\n`;
            }

            if (process.env.GITHUB_STEP_SUMMARY) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            }

            const totalLines = metrics.reduce((acc, s) => acc + (s.lf || 0), 0);
            const totalHits = metrics.reduce((acc, s) => acc + (s.lh || 0), 0);
            const pct = totalLines > 0 ? ((totalHits / totalLines) * 100).toFixed(1) : "0";

            if (process.env.GITHUB_OUTPUT) {
              appendFileSync(process.env.GITHUB_OUTPUT, `total_lines=${totalLines}\n`);
              appendFileSync(process.env.GITHUB_OUTPUT, `total_hits=${totalHits}\n`);
              appendFileSync(process.env.GITHUB_OUTPUT, `coverage_percentage=${pct}%\n`);
            }
          '

      - name: Upload Shields coverage badge JSON
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-badges
          path: coverage/badges/*.json
          if-no-files-found: error
          retention-days: 30

  # The components' own Rust tests and smoke runs, in parallel with `typescript`.
  components:
    name: Components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Install SQLite build toolchain
        run: |
          bash platform/sqlite-component/scripts/install-tools.sh --rust
          echo "$GITHUB_WORKSPACE/platform/sqlite-component/.tools/bin" >> "$GITHUB_PATH"

      # No `bun install`: the component scripts import only Bun built-ins.

      # The engine source build (Docker, about 6 minutes) is skipped when target/engine holds a
      # source-stamp matching its inputs; the key hashes the same files, so a hit restores a
      # matching stamp and anything stale is still rebuilt by build-engine.ts.
      - name: Cache PGlite engine source build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ENGINE_CACHE_PATHS }}
          key: pglite-engine-source-${{ hashFiles('platform/pglite-component/engine/**', 'platform/pglite-component/scripts/build-engine.ts', 'platform/pglite-component/scripts/patch-engine-source.ts', 'platform/pglite-component/scripts/tool-versions.env') }}

      - name: Cache Rust build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RUST_CACHE_PATHS }}
          key: rust-${{ github.job }}-${{ hashFiles('Cargo.lock', 'platform/*/Cargo.lock', 'platform/*/rust-toolchain.toml', 'platform/pglite-component/scripts/tool-versions.env') }}
          restore-keys: rust-${{ github.job }}-

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: 'v48.0.1'

      - name: Test embedded PGlite component against the real engine
        run: make -C platform/pglite-component tools-rust unit smoke

      # Plugs pglite-encfs into the pglite component built above and runs the encryption matrix.
      - name: Test pglite-encfs (encryption at rest) against the real engine
        run: make -C platform/pglite-encfs tools unit smoke

      - name: Build and test tenant OCI registry component
        run: make -C platform/oci-registry test lint build

  # T07 / #397: reserved for the registry-nats tests; other workflow work leaves this job alone.
  # Runs the registry migration Job as rendered (pinned nats-box, uid 65532, its workingDir)
  # against a throwaway nats-server under runc, entering the working directory as root before
  # dropping privileges, so it fails if the Job spec loses `workingDir: /tmp` (#391).
  registry-nats-smoke:
    name: Registry migration smoke (uid 65532)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the migration Job as uid 65532 against nats-server
        env:
          REGISTRY_NATS_SMOKE: '1'
          CONTAINER_RUNTIME: docker
        run: bun test platform/platform/tests/registry-nats-smoke.test.ts

  # #541 m2: the scheduler NATS broker test (design-541 section 8.2). Runs nats-server 2.12.8, pinned
  # by digest, with the golden accounts.conf and freshly minted scheduler CAs, and checks the
  # authorization matrix, forged certificates and reloads. Plain `bun test` skips it.
  scheduler-nats-broker:
    name: Scheduler NATS broker test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      # Builds tests/support/operator-nats: the runtime-operator's own nats.go connect options.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: platform/platform/tests/support/operator-nats/go.mod
          cache-dependency-path: platform/platform/tests/support/operator-nats/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the broker test against nats-server
        env:
          SCHEDULER_NATS_BROKER: '1'
          CONTAINER_RUNTIME: docker
        run: bun test platform/platform/tests/scheduler-nats-broker.test.ts platform/platform/tests/scheduler-nats-server.test.ts

  # The required check: green only when every job above is.
  build-and-test:
    name: Test
    # headlamp-plugin skips its steps, and succeeds, when a PR doesn't touch the plugin or the CRD.
    needs: [typescript, components, headlamp-plugin, registry-nats-smoke, scheduler-nats-broker]
    # always(): a failed or cancelled job must fail this check, not skip it (a skip passes).
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done

  publish-coverage-badges:
    name: Dispatch docs deploy for coverage badges
    needs: typescript
    if: ${{ !cancelled() && needs.typescript.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch coverage update to di-framework/docs
        env:
          DOCS_REPOSITORY_TOKEN: ${{ secrets.DOCS_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCS_REPOSITORY_TOKEN:-}" ]]; then
            echo "::warning::DOCS_REPOSITORY_TOKEN is not configured; di-framework/docs was not notified of coverage update"
            exit 0
          fi
          payload="$(jq -n --argjson run_id "$GITHUB_RUN_ID" --arg repository "$GITHUB_REPOSITORY" \
            '{event_type:"coverage-update",client_payload:{run_id:$run_id,repository:$repository}}')"
          curl --fail-with-body --silent --show-error \
            -X POST https://api.github.com/repos/di-framework/docs/dispatches \
            -H "Authorization: Bearer $DOCS_REPOSITORY_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload"
          echo "Dispatched coverage update to di-framework/docs (repository=$GITHUB_REPOSITORY run_id=$GITHUB_RUN_ID)"
