# Publish the tested pglite-encfs Wasm component (the encrypting wasi:filesystem layer that the
# CLI plugs between pglite and the host) to GHCR. The build job runs the same make targets as
# ci.yml, against the pglite component built from this commit, and holds no write token; the
# publish job only validates and pushes the already-tested dist/.
#
# Triggers (#172): a push to main that touches one of the paths below, and workflow_dispatch.
# check-source hashes the committed files in on.push.paths (scripts/source-check.ts); on a push
# the build is skipped when ghcr.io/di-framework/pglite-encfs:src-<hash> already exists. A
# dispatch always builds. publish tags the manifest src-<hash>, and pin opens the bot PR
# "chore: pin pglite-encfs to <digest>" (scripts/pin-artifact.ts). Only pin holds
# contents: write and pull-requests: write; only publish holds packages: write.
name: Publish pglite-encfs component

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'platform/pglite-encfs/**'
      - 'platform/wasm-component-publisher/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/pglite-encfs-publish.yml'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: publish-pglite-encfs
  cancel-in-progress: false

jobs:
  check-source:
    name: Check if source already published
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      source-hash: ${{ steps.check.outputs.hash }}
      skip: ${{ steps.check.outputs.skip }}
      stale: ${{ steps.check.outputs.stale }}
      digest: ${{ steps.check.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up source check
        uses: ./.github/actions/setup-source-check
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # On a push, skip=true when pglite-encfs:src-<hash> exists; a dispatch always builds.
      - name: Check if already published
        id: check
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
          SOURCE_CHECK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # FORCE is empty or one flag
          bun scripts/source-check.ts --workflow .github/workflows/pglite-encfs-publish.yml \
            --image ghcr.io/di-framework/pglite-encfs --stale-guard ${FORCE} --github-output

  build:
    name: Build and test pglite-encfs
    needs: check-source
    if: ${{ !cancelled() && needs.check-source.result == 'success' && needs.check-source.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      wasm_sha256: ${{ steps.dist.outputs.wasm_sha256 }}
    steps:
      - name: Require di-framework/platform
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != di-framework/platform ]]; then
            echo '::error::Only di-framework/platform can publish this component'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.97.1'
          targets: wasm32-wasip2, wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 'v48.0.1'

      # The smoke test plugs encfs into the pglite component built from this commit; the engine
      # cache is the one pglite-component-publish.yml fills.
      - name: Cache engine build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/pglite-component/target/engine
            platform/pglite-component/.tools
          key: pglite-engine-${{ hashFiles('platform/pglite-component/engine/**', 'platform/pglite-component/scripts/tool-versions.env', 'platform/pglite-component/scripts/build-engine.ts', 'platform/pglite-component/scripts/patch-engine-source.ts', 'platform/pglite-component/scripts/prepare-engine.ts', 'platform/pglite-component/wit/deps/pglite-engine/**') }}
          restore-keys: |
            pglite-engine-

      - name: Install Wasm build tools and build pglite
        run: |
          set -euo pipefail
          make -C platform/pglite-component tools-rust build
          echo "$GITHUB_WORKSPACE/platform/pglite-component/.tools/bin" >> "$GITHUB_PATH"

      - name: Test publisher crates
        run: |
          set -euo pipefail
          cargo clippy --locked -p wasm-component-publisher -p pglite-encfs-publisher --all-targets -- -D warnings
          cargo test --locked -p wasm-component-publisher -p pglite-encfs-publisher

      # `smoke` runs `build`, then the encryption matrix against the real engine.
      - name: Build and test pglite-encfs against the real engine
        run: make -C platform/pglite-encfs unit smoke

      - name: Validate the tested artifact without publishing
        run: cargo run --locked -p pglite-encfs-publisher -- --check

      - name: Record tested wasm digest
        id: dist
        run: |
          set -euo pipefail
          sum="$(sha256sum platform/pglite-encfs/dist/pglite-encfs.wasm | cut -d' ' -f1)"
          echo "wasm_sha256=${sum}" >> "$GITHUB_OUTPUT"

      - name: Upload tested dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pglite-encfs-dist
          path: platform/pglite-encfs/dist/
          if-no-files-found: error

  publish:
    name: Push ghcr.io/di-framework/pglite-encfs
    needs: [check-source, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.97.1'

      - name: Set up wash CLI
        uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: v2.5.2

      # The publisher pushes the component, its config and the manifest under the commit tag with
      # oras, pulls it back with wash by digest, then points the version tag at it with oras tag.
      - name: Set up ORAS
        uses: ./.github/actions/setup-oras

      - name: Build publisher (no credentials in scope)
        run: cargo build --locked -p pglite-encfs-publisher

      - name: Download tested dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pglite-encfs-dist
          path: platform/pglite-encfs/dist

      - name: Verify dist is the tested build
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.wasm_sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum platform/pglite-encfs/dist/pglite-encfs.wasm | cut -d' ' -f1)"
          if [[ -z "$EXPECTED_SHA256" || "$actual" != "$EXPECTED_SHA256" ]]; then
            echo "::error::downloaded wasm ($actual) differs from the tested build ($EXPECTED_SHA256)"
            exit 1
          fi

      # The publisher re-verifies SHA256SUMS, the exported wasi:filesystem/types interface and
      # that every import is wasi:*, then pushes the manifest under the commit tag, pulls it back
      # by digest to compare bytes, and only then points the version tag at that same manifest.
      # The manifest holds no wall-clock time (SOURCE_DATE_EPOCH is cleared below), so an
      # unchanged component keeps its digest.
      # Right before the tags move: a re-run of an older push whose inputs main has since
      # changed stops here (check-source is not re-run by "Re-run failed jobs").
      - name: Stop if main has newer inputs
        id: guard
        uses: ./.github/actions/source-guard
        with:
          workflow: .github/workflows/pglite-encfs-publish.yml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and verify component
        if: steps.guard.outputs.stale != 'true'
        env:
          PUSH: 'true'
          # Cleared so no exported value reaches the publisher: a per-commit created time
          # would give an unchanged component a new digest on every publish.
          SOURCE_DATE_EPOCH: ''
          DI_OCI_REGISTRY: ghcr.io
          DI_OCI_CLUSTER_REGISTRY: ghcr.io
          DI_OCI_REPOSITORY: di-framework/pglite-encfs
          DI_OCI_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: target/debug/pglite-encfs-publisher

      - name: Record component digest
        if: steps.guard.outputs.stale != 'true'
        id: digest
        run: |
          set -euo pipefail
          report=platform/pglite-encfs/dist/publish-report.json
          digest="$(jq -er '.manifestDigest | select(test("^sha256:[0-9a-f]{64}$"))' "$report")"
          ref="ghcr.io/di-framework/pglite-encfs@${digest}"
          printf 'Published %s\n' "$ref"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo '### pglite-encfs component'
            echo
            # shellcheck disable=SC2016 # the backticks are Markdown, not expansions
            printf '```\n%s\n```\n' "$ref"
            echo
            echo 'Tags (movable): the commit SHA and the WIT package version, both pointing at the digest above.'
            echo 'Only the digest is immutable. The pushed manifest was pulled back by digest and byte-compared with the tested build.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag with source hash
        if: steps.guard.outputs.stale != 'true'
        env:
          SOURCE_HASH: ${{ needs.check-source.outputs.source-hash }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_HASH}" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::missing source hash'
            exit 1
          fi
          printf '%s' "${GHCR_TOKEN}" | oras login ghcr.io --username "${GHCR_USERNAME}" --password-stdin
          oras tag "ghcr.io/di-framework/pglite-encfs@${DIGEST}" "src-${SOURCE_HASH}"
          echo "Tagged ghcr.io/di-framework/pglite-encfs@${DIGEST} with src-${SOURCE_HASH}"

      - name: Upload publish report
        if: steps.guard.outputs.stale != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pglite-encfs-publish-report
          path: platform/pglite-encfs/dist/publish-report.json
          if-no-files-found: error

  # A revert to an already-published source skips the build; point the moving version tag back at
  # that source's digest. scripts/retag.sh leaves a tag that already points there alone, and the
  # guard stops a run whose inputs main has since changed.
  realign:
    name: Point the version tag at the published source
    needs: check-source
    if: ${{ !cancelled() && needs.check-source.result == 'success' && needs.check-source.outputs.skip == 'true' && needs.check-source.outputs.stale != 'true' && needs.check-source.outputs.digest != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stop if main has newer inputs
        id: guard
        uses: ./.github/actions/source-guard
        with:
          workflow: .github/workflows/pglite-encfs-publish.yml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up ORAS
        if: steps.guard.outputs.stale != 'true'
        uses: ./.github/actions/setup-oras

      - name: Retag
        if: steps.guard.outputs.stale != 'true'
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/di-framework/pglite-encfs
          DIGEST: ${{ needs.check-source.outputs.digest }}
        run: |
          set -euo pipefail
          # The version tag the publisher moves: the WIT package version (build-support/build.rs).
          TAGS="$(sed -n 's/^package di-framework:pglite-encfs@\(.*\);$/\1/p' platform/pglite-encfs/wit/world.wit)"
          if [[ -z "${TAGS}" ]]; then
            echo '::error::no WIT package version in platform/pglite-encfs/wit/world.wit'
            exit 1
          fi
          export TAGS
          printf '%s' "${GHCR_TOKEN}" | oras login ghcr.io --username "${GHCR_USERNAME}" --password-stdin
          bash scripts/retag.sh

  pin:
    name: Open pin PR
    # After a publish, or when this push's source was already published (a revert to an older
    # source, or a pin PR closed unmerged): then check-source's digest is pinned again.
    # pin-artifact.ts finds nothing to change when main already has it, so that is a no-op.
    needs: [check-source, publish, realign]
    if: >-
      ${{ !cancelled() && needs.check-source.result == 'success' && github.ref == 'refs/heads/main' &&
      ((needs.publish.result == 'success' && needs.publish.outputs.digest != '') ||
      (needs.check-source.outputs.skip == 'true' && needs.check-source.outputs.stale != 'true' &&
      needs.check-source.outputs.digest != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open pin PR
        uses: ./.github/actions/open-pin-pr
        with:
          name: pglite-encfs
          workflow: .github/workflows/pglite-encfs-publish.yml
          pins: pglite-encfs ${{ needs.publish.outputs.digest || needs.check-source.outputs.digest }}
          token: ${{ secrets.GITHUB_TOKEN }}
